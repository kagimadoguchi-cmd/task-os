<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
/* 携帯：上に細い見出し・下に5つのアイコン／PC（900px〜）：左にメニュー、真ん中に流れる投稿。インスタの並びを役員のタスク管理に */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --sub:#F2F3F5; --line:#E4E6EA; --ink:#121417; --ink2:#4A4F57; --ink3:#8B919A;
  --blue:#3D8BEF; --blue-ink:#FFFFFF; --heart:#E5484D; --badge:#E04B4B; --verify:#3D8BEF;
  --done:#2E8B57; --done-bg:#E3F2EA; --doing:#2F6FD6; --doing-bg:#E5EEFB; --todo:#6B7280; --todo-bg:#EEF0F3; --late:#D23B2E; --late-bg:#FBE7E4;
  --ring:linear-gradient(45deg,#F9C164 0%,#F0884A 30%,#D94C7A 62%,#8E4BD1 100%);
  --logo:linear-gradient(135deg,#8E4BD1 0%,#D94C7A 45%,#F0A04A 100%);
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
/* 達成のお祝い（5回タップ） */
.p2-lab.cele-bump{animation:cele-bump .35s cubic-bezier(.2,1.8,.4,1)!important}
@keyframes cele-bump{0%{transform:scale(1)}40%{transform:scale(calc(1.1 + var(--n,1) * .06)) rotate(calc(var(--n,1) * 3deg))}100%{transform:scale(1)}}
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;animation:cele-in .35s ease-out both}
.cele.out{animation:cele-out .45s ease-in forwards}
@keyframes cele-in{from{opacity:0}to{opacity:1}}
@keyframes cele-out{to{opacity:0;transform:scale(1.05)}}
.cele-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(52,26,96,.94),rgba(10,6,24,.97));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cele-rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.12) 0 9deg,transparent 9deg 22deg);animation:cele-spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%)}
@keyframes cele-spin{to{transform:rotate(360deg)}}
.cele-conf{position:absolute;inset:0;pointer-events:none}
.cf2{position:absolute;top:-24px;width:var(--w);height:calc(var(--w) * .55);background:var(--c);opacity:0;animation-name:cf2-fall;animation-timing-function:cubic-bezier(.25,.6,.45,1);animation-fill-mode:forwards;animation-iteration-count:1}
.cf2.c{border-radius:50%;height:var(--w)}
.cf2.s{height:calc(var(--w) * 1.6);width:calc(var(--w) * .4);border-radius:2px}
@keyframes cf2-fall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.fw{position:absolute;width:0;height:0;animation:fw-go 1.2s ease-out both}
.fw i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;animation:fw-p 1.2s cubic-bezier(.1,.7,.3,1) both}
@keyframes fw-go{from{opacity:1}to{opacity:1}}
@keyframes fw-p{0%{transform:rotate(var(--r)) translateY(0) scale(1.4);opacity:1}70%{opacity:1}100%{transform:rotate(var(--r)) translateY(calc(var(--d) * -1)) scale(.2);opacity:0}}
.cele-card{position:relative;z-index:2;width:min(86vw,380px);text-align:center;color:#fff;padding:26px 22px 22px;animation:cele-card .9s cubic-bezier(.2,1.5,.35,1) .1s both}
@keyframes cele-card{0%{transform:scale(.3) translateY(40px);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
.cele-medal{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F5C518 45%,#C98A00);box-shadow:0 0 0 6px rgba(255,215,90,.25),0 0 40px rgba(255,200,60,.7);animation:medal 1.2s cubic-bezier(.2,1.5,.35,1) .25s both,medal-glow 2s ease-in-out 1.4s infinite}
.cele-medal svg{width:58px;height:58px;fill:none;stroke:#7A4A00;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes medal{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:none}}
@keyframes medal-glow{0%,100%{box-shadow:0 0 0 6px rgba(255,215,90,.25),0 0 30px rgba(255,200,60,.55)}50%{box-shadow:0 0 0 12px rgba(255,215,90,.15),0 0 60px rgba(255,200,60,.9)}}
.cele-big{margin:0;font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-size:64px;line-height:1.1;letter-spacing:.04em;background:linear-gradient(90deg,#FFE066,#FF8A3D,#FF4D8D,#9B6BFF,#4DB2FF,#FFE066);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,120,80,.45));animation:cele-big 1s cubic-bezier(.2,1.6,.35,1) .45s both,cele-rain 3s linear 1.4s infinite}
@keyframes cele-big{0%{transform:scale(2.6);opacity:0;letter-spacing:.5em}60%{transform:scale(.92);opacity:1}100%{transform:none;opacity:1;letter-spacing:.04em}}
@keyframes cele-rain{to{background-position:300% 0}}
.cele-sub{margin:4px 0 0;font-size:20px;font-weight:900;animation:cele-up .6s ease-out .8s both}
.cele-task{margin:10px 0 0;font-size:14px;font-weight:700;opacity:.9;animation:cele-up .6s ease-out .95s both}
.cele-msg{margin:12px 0 0;font-size:13px;line-height:1.7;opacity:.95;animation:cele-up .6s ease-out 1.1s both}
.cele-cnt{margin:12px auto 0;display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;animation:cele-up .6s ease-out 1.25s both}
.cele-cnt b{font-size:18px;color:#FFE066;margin:0 2px}
.cele-btn{display:block;margin:18px auto 0;border:0;border-radius:999px;padding:14px 34px;font-size:16px;font-weight:900;color:#3A2400;background:linear-gradient(90deg,#FFE066,#FFB347);box-shadow:0 8px 24px rgba(255,180,60,.5);cursor:pointer;animation:cele-up .6s ease-out 1.4s both,btn-pulse 1.6s ease-in-out 2.2s infinite}
@keyframes cele-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes btn-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.cele *,.cele{animation:none!important}.cf2,.fw{display:none}.cele-card,.cele-sub,.cele-task,.cele-msg,.cele-cnt,.cele-btn{opacity:1}}
/* 文字のコピー・調べる などはできないように（コメントの文と入力欄だけはできる） */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],.cm-t{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* カードを押したとき：指の方へ少し傾いて浮き上がり（大きくなる）、指の下が光る。離すと波紋が広がって、ぽよんと弾んで戻る */
.panel,.co-c,.al-row{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,1.5,.35,1),box-shadow .35s;will-change:transform;--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--tc:var(--sc,#3D8BEF)}
.co-c{--tc:var(--cc)}
.panel.pressing,.co-c.pressing,.al-row.pressing{transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.06) translateY(-2px);transition:transform .16s ease-out,box-shadow .16s;box-shadow:0 16px 34px color-mix(in srgb,var(--tc) 38%,transparent),0 4px 10px rgba(0,0,0,.08)}
.tap-shine{position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:3;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 22%,transparent 55%)}
.pressing>.tap-shine{opacity:1}
.tap-rip{position:absolute;z-index:2;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 45%,#fff) 0%,color-mix(in srgb,var(--tc) 30%,transparent) 45%,transparent 70%);animation:tap-rip .7s cubic-bezier(.2,.7,.3,1) forwards}
.co-c .tap-rip{background:radial-gradient(circle,rgba(255,255,255,.7) 0%,rgba(255,255,255,.25) 45%,transparent 70%)}
.tap-ring{position:absolute;z-index:2;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;border:2px solid color-mix(in srgb,var(--tc) 60%,#fff);animation:tap-ring .6s ease-out forwards}
.card-pop{animation:card-pop .6s cubic-bezier(.2,1.5,.35,1)}
@keyframes tap-rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(14);opacity:0}}
@keyframes tap-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
@keyframes card-pop{0%{transform:perspective(700px) scale(1.06)}30%{transform:perspective(700px) scale(.96)}55%{transform:perspective(700px) scale(1.03)}78%{transform:perspective(700px) scale(.995)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.co-c,.al-row{transition:none}.pressing{transform:none!important}.tap-rip,.tap-ring,.card-pop{animation:none!important;display:none}}
html{overscroll-behavior-y:contain}
/* 引っぱって更新：丸い目盛り＋ひとことの札 */
/* 外側は画面の横いっぱい（真ん中寄せだけ）。札（.ptr-in）は文の長さに合わせて広がるので、文が枠からはみ出さない */
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:15;display:flex;justify-content:center;padding:0 16px;opacity:0;transform:translateY(0) scale(.82);transform-origin:50% 0;pointer-events:none;will-change:transform,opacity}
.ptr-in{display:inline-flex;align-items:center;flex:none;max-width:100%;padding:5px 16px 5px 5px;border-radius:999px;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.14),0 0 0 1px var(--line);white-space:nowrap;transition:background .25s,box-shadow .25s}
.ptr-ic{margin-right:9px}
.ptr-t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ptr.back{transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.ptr-ic{position:relative;width:34px;height:34px;display:grid;place-items:center;flex:none}
.ptr-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ptr-ring circle{fill:none;stroke-width:3}
.ptr-ring .bgc{stroke:var(--sub)}
.ptr-ring .fg{stroke:url(#ptrg);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .05s linear}
.ptr-arrow,.ptr-ok{position:absolute;width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ptr-arrow{stroke:var(--ink2);transform:rotate(calc(var(--k,0) * 180deg));transition:transform .2s}
.ptr-ok{stroke:#fff;opacity:0;stroke-dasharray:1;stroke-dashoffset:1}
.ptr-t{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
/* いっぱいまで引いた */
.ptr.ready .ptr-in{background:linear-gradient(90deg,#3D8BEF,#8E4BD1);box-shadow:0 8px 24px rgba(91,90,230,.45)}
.ptr.ready .ptr-t{color:#fff}
.ptr.ready .ptr-arrow{stroke:#fff;transform:rotate(180deg)}
.ptr.ready .ptr-ring .bgc{stroke:rgba(255,255,255,.3)}
.ptr.ready .ptr-ring .fg{stroke:#fff}
.ptr.ready .ptr-ic{animation:ptr-pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes ptr-pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
/* 更新中 */
.ptr.spin .ptr-in{background:linear-gradient(90deg,#3D8BEF,#8E4BD1,#3D8BEF);background-size:200% 100%;animation:ptr-flow 1.2s linear infinite;box-shadow:0 8px 24px rgba(91,90,230,.45)}
.ptr.spin .ptr-t{color:#fff}
.ptr.spin .ptr-t::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:ptr-dots 1s steps(4) infinite}
.ptr.spin .ptr-arrow{opacity:0}
.ptr.spin .ptr-ring{animation:ptr-rot .8s linear infinite}
.ptr.spin .ptr-ring .bgc{stroke:rgba(255,255,255,.25)}
.ptr.spin .ptr-ring .fg{stroke:#fff;stroke-dashoffset:70!important;transition:none}
@keyframes ptr-rot{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
@keyframes ptr-flow{to{background-position:-200% 0}}
@keyframes ptr-dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* 終わった */
.ptr.done .ptr-in{background:linear-gradient(90deg,#2E8B57,#3BB273);box-shadow:0 8px 24px rgba(46,139,87,.4)}
.ptr.done .ptr-t{color:#fff}
.ptr.done .ptr-arrow{opacity:0}
.ptr.done .ptr-ring{opacity:0}
.ptr.done .ptr-ic{background:rgba(255,255,255,.2);border-radius:50%;animation:ptr-pop .5s cubic-bezier(.2,1.8,.4,1)}
.ptr.done .ptr-ok{opacity:1;animation:ptr-check .45s ease-out forwards}
@keyframes ptr-check{to{stroke-dashoffset:0}}
.ptr-fx{position:absolute;left:50%;top:50%;width:0;height:0}
.ptr-fx i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);animation:ptr-fx .6s ease-out forwards}
@keyframes ptr-fx{0%{transform:rotate(var(--r)) translateY(-10px);opacity:1}100%{transform:rotate(var(--r)) translateY(-30px) scale(.2);opacity:0}}
@media (min-width:900px){.ptr{top:16px;padding-left:296px}}
@media (prefers-reduced-motion:reduce){.ptr *,.ptr{animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 全体の並び */

.main{flex:1;min-width:0;display:flex;justify-content:center}

.login-card .brand i.lg2{width:60px;height:60px;border-radius:15px}.login-card .brand .lg2 .l1{font-size:14px}.login-card .brand .lg2 .l2{font-size:20px}

/* 携帯の上の見出し */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:54px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}

/* 上の見出し「タスクOS」：真ん中。押すとタスク一覧 */

const keepDraft = () => { const g = document.getElementById('pf-goal'), v = document.getElementById('pf-vision'); if (g) draft.goal = g.value; if (v) draft.vision = v.value; };
const CROP = 260;
function cropStart(file){
  if (!file || !/^image\//.test(file.type)){ toast('写真を選んでください'); return; }
  const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
    const s0 = Math.max(CROP/img.width, CROP/img.height); crop = {img, s0, z:1, x:(CROP-img.width*s0)/2, y:(CROP-img.height*s0)/2};
    document.getElementById('crop-box').innerHTML = `<div class="crop" id="crop"><img src="${r.result}" id="crop-img" alt=""></div>
      <div class="rng"><span>－</span><input type="range" id="crop-z" min="1" max="4" step="0.01" value="1" aria-label="大きさ"><span>＋</span></div>
      <p style="margin:0;text-align:center;color:var(--ink3);font-size:12px">指でずらして、つまみで大きさを変えます</p>
      <div class="btns"><button class="btn ghost" data-act="cropno">やめる</button><button class="btn" data-act="cropok">この写真にする</button></div>`;
    cropDraw(); const area = document.getElementById('crop'); let drag = null;
    area.addEventListener('pointerdown', ev=>{ drag = {x:ev.clientX, y:ev.clientY, ox:crop.x, oy:crop.y}; area.setPointerCapture(ev.pointerId); });
    area.addEventListener('pointermove', ev=>{ if (!drag) return; crop.x = drag.ox + ev.clientX - drag.x; crop.y = drag.oy + ev.clientY - drag.y; cropDraw(); });
    area.addEventListener('pointerup', ()=>{ drag = null; });
    document.getElementById('crop-z').addEventListener('input', ev=>{ const c = CROP/2, s1 = crop.s0*crop.z, ix = (c-crop.x)/s1, iy = (c-crop.y)/s1; crop.z = +ev.target.value; const s2 = crop.s0*crop.z; crop.x = c-ix*s2; crop.y = c-iy*s2; cropDraw(); });
  }; img.src = r.result; }; r.readAsDataURL(file);
}
function cropDraw(){ const el = document.getElementById('crop-img'); if (!el || !crop) return; const s = crop.s0*crop.z, w = crop.img.width*s, h = crop.img.height*s;
  crop.x = Math.min(0, Math.max(CROP-w, crop.x)); crop.y = Math.min(0, Math.max(CROP-h, crop.y));
  Object.assign(el.style, {width:w+'px', height:h+'px', transform:`translate(${crop.x}px,${crop.y}px)`}); }
function cropDone(){ const s = crop.s0*crop.z, c = document.createElement('canvas'); c.width = c.height = 400;
  c.getContext('2d').drawImage(crop.img, -crop.x/s, -crop.y/s, CROP/s, CROP/s, 0, 0, 400, 400); keepDraft(); draft.photo = c.toDataURL('image/jpeg', .85); crop = null; pfSheet(); }

  if (S.screen!=='login') return; const dx = x1-x0, dy = y1-y0, now = Date.now();
  const mv = Math.hypot(dx,dy) < 30 ? (x1 < innerWidth/2 ? 'TL' : 'TR') : Math.abs(dx) > Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'D':'U');

      if (!cache.has(coll)) cache.set(coll, new Map()); cache.get(coll).set(id, r.body); emitColl(coll); emitDoc(r.path, r.body); })
    .subscribe(st=>{ if (st==='CHANNEL_ERROR' || st==='TIMED_OUT') fails.forEach(f=>{ try { f(); } catch(e){} });
      /* つながった（つなぎ直した）時は、その間の変更を取りこぼさないように読み直す */
      if (st==='SUBSCRIBED'){ [...collL.keys()].forEach(c=>load(c).then(()=>emitColl(c)).catch(()=>{}));
        [...docL.keys()].forEach(p=>Promise.resolve(sb.from(T).select('body').eq('path', p).maybeSingle()).then(({data})=>{ if (data) emitDoc(p, data.body); }).catch(()=>{})); } }); };
  const load = coll => Promise.resolve(sb.from(T).select('path,body').eq('coll', coll)).then(({data, error})=>{ if (error) throw mapErr(error);
    const m = new Map(); (data || []).forEach(r=>m.set(splitP(r.path)[1], r.body)); cache.set(coll, m); return snap(coll); });
  return {
    collection: coll => ({
      get: () => load(coll),
      onSnapshot: (cb, fail) => { live(); push(collL, coll, cb); if (fail) fails.push(fail); load(coll).then(cb).catch(()=>{ if (fail) fail(); }); }
    }),
    doc: path => ({
      set: body => { const [coll, id] = splitP(path); return Promise.resolve(sb.from(T).upsert({path, coll, id, body, updated_at:new Date().toISOString()})).then(({error})=>{ if (error) throw mapErr(error); }); },
      delete: () => Promise.resolve(sb.from(T).delete().eq('path', path)).then(({error})=>{ if (error) throw mapErr(error); }),
      onSnapshot: (cb, fail) => { live(); push(docL, path, cb); if (fail) fails.push(fail);
        Promise.resolve(sb.from(T).select('body').eq('path', path).maybeSingle()).then(({data, error})=>{ if (error){ if (fail) fail(); return; } if (data) cb({exists:true, data:()=>data.body}); }); }
    })
  };
}
let DBX = null, liveWait = false, roWarned = false;
const SESS_KEY = 'exec-task-board-session-v1', SESS_DAYS = 7;
const SYNCED = new Map(), PSYNCED = new Map(), DSYNCED = new Map(), CHAIN = new Map();
const jkey = o => JSON.stringify(o);
/* 同じ置き場への書きこみは1つずつ順番に */
function dbWrite(path, fn){
  const p = (CHAIN.get(path) || Promise.resolve()).then(fn).catch(e=>{
    if (e && e.code==='invalid_argument' && !roWarned){ roWarned = true; toast('見るだけの権限なので、変更はみんなに届きません'); }
    else if (e && e.code==='quota_exceeded') toast('共有の置き場がいっぱいです。管理者に知らせてください');
    else if (e && e.code==='unavailable') setTimeout(()=>{ dbWrite(path, fn); }, 800 + Math.random()*800);
  });
  CHAIN.set(path, p); p.then(()=>{ if (CHAIN.get(path)===p) CHAIN.delete(path); });
}
function pushTasks(){ if (!DBX) return;
  const now = new Set();
  TASKS.forEach(t=>{ now.add(t.id); const j = jkey(t); if (SYNCED.get(t.id)===j) return; SYNCED.set(t.id, j); const body = JSON.parse(j); dbWrite('tasks/'+t.id, ()=>DBX.doc('tasks/'+t.id).set(body)); });
  [...SYNCED.keys()].forEach(id=>{ if (!now.has(id)){ SYNCED.delete(id); dbWrite('tasks/'+id, ()=>DBX.doc('tasks/'+id).delete()); } });
}
function pushProf(){ if (!DBX) return;
  Object.keys(PROF).forEach(id=>{ const j = jkey(PROF[id]); if (PSYNCED.get(id)===j) return; PSYNCED.set(id, j); const body = JSON.parse(j); dbWrite('prof/'+id, ()=>DBX.doc('prof/'+id).set(body)); });
}
function pushDoc(path, body){ if (!DBX) return; const j = jkey(body); if (DSYNCED.get(path)===j) return; DSYNCED.set(path, j); const b = JSON.parse(j); dbWrite(path, ()=>DBX.doc(path).set(b)); }
/* 入力中や、下から出る画面を開いている時は、閉じてから描き直す */
function liveRender(){
  if (S.screen!=='app') return;
  const a = document.activeElement;
  if (document.getElementById('scrim') || (a && a.matches && a.matches('input,textarea,select'))){ if (!liveWait){ liveWait = true; setTimeout(()=>{ liveWait = false; liveRender(); }, 900); } return; }
  render();
}
function takeTasks(docs){
  const arr = docs.map(d=>JSON.parse(jkey(d.data()))).filter(t=>t && t.id).sort((a,b)=>(b.at||0)-(a.at||0));
  SYNCED.clear(); arr.forEach(t=>SYNCED.set(t.id, jkey(t)));
  const same = arr.length===TASKS.length && arr.every(t=>{ const o = TASKS.find(x=>x.id===t.id); return o && jkey(o)===SYNCED.get(t.id); });
  if (same) return;
  TASKS = arr; try { localStorage.setItem(KEY, jkey(TASKS)); } catch(e){}
  liveRender();
}
function refetchTasks(){ DBX.collection('tasks').get().then(sn=>{ if (!sn.empty || !sn.metadata.fromCache) takeTasks(sn.docs); }).catch(()=>{}); }
function startSync(db){
  DBX = db; liveRender();
  let warn = setTimeout(()=>{ warn = null; toast('共有データにつながりません。この端末の保存で表示しています'); }, 10000);
  const ok = () => { if (warn){ clearTimeout(warn); warn = null; } };
  const fail = () => { ok(); toast('共有データとの接続が切れました。もう一度開きなおしてください'); };
  db.collection('tasks').onSnapshot(sn=>{ if (sn.empty && sn.metadata.fromCache) return; if (!sn.metadata.fromCache) ok(); takeTasks(sn.docs); }, fail);
  db.collection('stories').onSnapshot(sn=>{ if (sn.empty && sn.metadata.fromCache) return;
    const all = sn.docs.map(d=>JSON.parse(jkey(d.data()))).filter(x=>x && x.id);
    all.filter(x=>Date.now()-x.at >= ST_LIFE).forEach(x=>dbWrite('stories/'+x.id, ()=>db.doc('stories/'+x.id).delete()));
    const next = all.filter(x=>Date.now()-x.at < ST_LIFE), j = jkey(next.map(x=>x.id).sort());
    if (j===jkey(stLive().map(x=>x.id).sort())) return; STORIES = next; saveStLocal(); liveRender(); }, fail);
  db.collection('storycm').onSnapshot(sn=>{ if (sn.empty && sn.metadata.fromCache) return;
    const all = sn.docs.map(d=>JSON.parse(jkey(d.data()))).filter(x=>x && x.id);
    all.filter(x=>Date.now()-x.at >= ST_LIFE).forEach(x=>dbWrite('storycm/'+x.id, ()=>db.doc('storycm/'+x.id).delete()));
    STCM = all.filter(x=>Date.now()-x.at < ST_LIFE); try { localStorage.setItem(SCKEY, jkey(STCM)); } catch(e){} if (svRefresh) svRefresh(); }, fail);
  db.collection('prof').onSnapshot(sn=>{ let ch = false;
    sn.docs.forEach(d=>{ const v = JSON.parse(jkey(d.data())), j = jkey(v); PSYNCED.set(d.id, j); if (jkey(PROF[d.id])!==j){ PROF[d.id] = v; ch = true; } });
    if (ch){ try { localStorage.setItem(PKEY, jkey(PROF)); } catch(e){} liveRender(); } }, fail);
  const one = (path, lsKey, get, set) => db.doc(path).onSnapshot(d=>{ if (!d.exists) return; const v = get(JSON.parse(jkey(d.data()))); if (v==null) return; const j = jkey(v);
    DSYNCED.set(path, jkey(d.data())); if (j===jkey(set())) return; set(v); try { localStorage.setItem(lsKey, j); } catch(e){} liveRender(); }, fail);
  one('app/units', UKEY, b=>b.m, v=>v===undefined ? UMEM : (UMEM = v));
  one('app/block', BKEY, b=>b.list, v=>v===undefined ? BLOCK : (BLOCK = v));
  one('app/foot', FKEY, b=>b.m, v=>v===undefined ? FOOT : (FOOT = v));
  db.doc('app/people').onSnapshot(d=>{ if (!d.exists) return; const b = JSON.parse(jkey(d.data())), list = Array.isArray(b.list) ? b.list : [], hide = Array.isArray(b.hide) ? b.hide : []; DSYNCED.set('app/people', jkey(d.data()));
    if (jkey(list)===jkey(ADDP) && jkey(hide)===jkey(HIDEP)) return; ADDP = list; HIDEP = hide; try { localStorage.setItem(NPKEY, jkey(ADDP)); localStorage.setItem(NHKEY, jkey(HIDEP)); } catch(e){} mergeAdded(ADDP); refreshExecs(); liveRender(); }, fail);
}
/* ログインをたもつ：最後に使ってから7日のあいだは、開くとそのまま入れる（ログアウトで消える） */
function sessKeep(){ try { const o = JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if (!o || o.me!==S.me || Date.now()-o.at > 36e5) localStorage.setItem(SESS_KEY, JSON.stringify({me:S.me, at:Date.now()})); } catch(e){} }
function sessClear(){ try { localStorage.removeItem(SESS_KEY); } catch(e){} }
(()=>{ try { const o = JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if (!o) return;
  if (Date.now()-o.at < SESS_DAYS*864e5 && canUse(E(o.me))){ S.me = o.me; S.screen = 'app'; S.view = 'home'; } else sessClear(); } catch(e){} })();
/* 共有の置き場につなぐ。claude.ai のアーティファクトの中ではアーティファクトの置き場、それ以外（GitHub などに置いた時）は Supabase。どちらもなければこの端末の保存だけ */
try {
  if (window.claude && window.claude.use) window.claude.use('db').then(db=>{ if (db) startSync(db); else document.body.classList.add('guest'); }).catch(()=>{});
  else if (SUPA.url && SUPA.key){
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = () => { try { startSync(supaDb(window.supabase.createClient(SUPA.url, SUPA.key))); } catch(e){ toast('共有データにつながりません。この端末の保存で表示しています'); } };
    s.onerror = () => toast('共有データの部品を読みこめません。この端末の保存で表示しています');
    document.head.appendChild(s);
  }
} catch(e){}

render();
})();
</script>
