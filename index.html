<style>
/* 携帯：上に細い見出し・下に5つのアイコン／PC（900px〜）：左にメニュー、真ん中に流れる投稿。インスタの並びを役員のタスク管理に */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --sub:#F2F3F5; --line:#E4E6EA; --ink:#121417; --ink2:#4A4F57; --ink3:#8B919A;
  --blue:#3D8BEF; --blue-ink:#FFFFFF; --heart:#E5484D; --badge:#E04B4B; --verify:#3D8BEF;
  --done:#2E8B57; --done-bg:#E3F2EA; --doing:#2F6FD6; --doing-bg:#E5EEFB; --todo:#6B7280; --todo-bg:#EEF0F3; --late:#D23B2E; --late-bg:#FBE7E4;
  --ring:linear-gradient(45deg,#F9C164 0%,#F0884A 30%,#D94C7A 62%,#8E4BD1 100%);
  --logo:linear-gradient(135deg,#8E4BD1 0%,#D94C7A 45%,#F0A04A 100%);
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
/* 達成のお祝い（5回タップ） */
.p2-lab.cele-bump{animation:cele-bump .35s cubic-bezier(.2,1.8,.4,1)!important}
@keyframes cele-bump{0%{transform:scale(1)}40%{transform:scale(calc(1.1 + var(--n,1) * .06)) rotate(calc(var(--n,1) * 3deg))}100%{transform:scale(1)}}
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;animation:cele-in .35s ease-out both}
.cele.out{animation:cele-out .45s ease-in forwards}
@keyframes cele-in{from{opacity:0}to{opacity:1}}
@keyframes cele-out{to{opacity:0;transform:scale(1.05)}}
.cele-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(52,26,96,.94),rgba(10,6,24,.97));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cele-rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.12) 0 9deg,transparent 9deg 22deg);animation:cele-spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%)}
@keyframes cele-spin{to{transform:rotate(360deg)}}
.cele-conf{position:absolute;inset:0;pointer-events:none}
.cf2{position:absolute;top:-24px;width:var(--w);height:calc(var(--w) * .55);background:var(--c);opacity:0;animation-name:cf2-fall;animation-timing-function:cubic-bezier(.25,.6,.45,1);animation-fill-mode:forwards;animation-iteration-count:1}
.cf2.c{border-radius:50%;height:var(--w)}
.cf2.s{height:calc(var(--w) * 1.6);width:calc(var(--w) * .4);border-radius:2px}
@keyframes cf2-fall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.fw{position:absolute;width:0;height:0;animation:fw-go 1.2s ease-out both}
.fw i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;animation:fw-p 1.2s cubic-bezier(.1,.7,.3,1) both}
@keyframes fw-go{from{opacity:1}to{opacity:1}}
@keyframes fw-p{0%{transform:rotate(var(--r)) translateY(0) scale(1.4);opacity:1}70%{opacity:1}100%{transform:rotate(var(--r)) translateY(calc(var(--d) * -1)) scale(.2);opacity:0}}
.cele-card{position:relative;z-index:2;width:min(86vw,380px);text-align:center;color:#fff;padding:26px 22px 22px;animation:cele-card .9s cubic-bezier(.2,1.5,.35,1) .1s both}
@keyframes cele-card{0%{transform:scale(.3) translateY(40px);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
.cele-medal{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F5C518 45%,#C98A00);box-shadow:0 0 0 6px rgba(255,215,90,.25),0 0 40px rgba(255,200,60,.7);animation:medal 1.2s cubic-bezier(.2,1.5,.35,1) .25s both,medal-glow 2s ease-in-out 1.4s infinite}
.cele-medal svg{width:58px;height:58px;fill:none;stroke:#7A4A00;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes medal{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:none}}

/* カードを押したとき：指の方へ少し傾いて浮き上がり（大きくなる）、指の下が光る。離すと波紋が広がって、ぽよんと弾んで戻る */
.panel,.co-c,.al-row{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,1.5,.35,1),box-shadow .35s;will-change:transform;--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--tc:var(--sc,#3D8BEF)}

.card-pop{animation:card-pop .6s cubic-bezier(.2,1.5,.35,1)}

/* 外側は画面の横いっぱい（真ん中寄せだけ）。札（.ptr-in）は文の長さに合わせて広がるので、文が枠からはみ出さない */
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:15;display:flex;justify-content:center;padding:0 16px;opacity:0;transform:translateY(0) scale(.82);transform-origin:50% 0;pointer-events:none;will-change:transform,opacity}

.ptr-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ptr-ring circle{fill:none;stroke-width:3}
.ptr-ring .bgc{stroke:var(--sub)}
.ptr-ring .fg{stroke:url(#ptrg);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .05s linear}
.ptr-arrow,.ptr-ok{position:absolute;width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* いっぱいまで引いた */

@keyframes ptr-pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
/* 更新中 */
.ptr.spin .ptr-in{background:linear-gradient(90deg,#3D8BEF,#8E4BD1,#3D8BEF);background-size:200% 100%;animation:ptr-flow 1.2s linear infinite;box-shadow:0 8px 24px rgba(91,90,230,.45)}

.ptr.spin .ptr-arrow{opacity:0}

/* 投稿の画面 */
/* ストーリーを作る画面 */
.sc.sc-slide{animation:none;will-change:transform;box-shadow:16px 0 40px rgba(0,0,0,.45)}
.shell.swiping{position:relative;overflow:hidden;will-change:transform}
/* スワイプ中に画面を暗くする黒い膜。filter（brightness）は毎フレーム描き直しで重くカクつくので、透明度だけで暗くする */
.shell.swiping::after{content:"";position:absolute;inset:0;z-index:999;background:#000;opacity:var(--dim,0);pointer-events:none}
.shell.sw-anim::after{transition:opacity var(--ms,200ms) ease-out}
.sc.sc-slide .sc-hint{opacity:0}
/* スワイプ中の目印（作成画面の右はし） */
.sc-pull{position:absolute;right:16px;top:50%;z-index:5;width:120px;margin-top:-70px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;opacity:0;pointer-events:none;transform:scale(calc(.7 + .3*var(--k,0)))}
.sc-pull i{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#7B2FF7,#E1306C 55%,#FCAF45);box-shadow:0 8px 24px rgba(225,48,108,.45);transform:rotate(calc(-90deg + 90deg*var(--k,0)));transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.sc-pull i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);opacity:0}
.sc-pull i svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6}
.sc-pull b{font-size:16px;font-weight:900;letter-spacing:.04em}
.sc-pull small{font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.sc-pull.ready i{transform:rotate(0) scale(1.15)}
.sc-pull.ready i::after{animation:pull-ring .5s ease-out forwards}
.sc-pull.ready small{color:#fff}
@keyframes pull-ring{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
.sc-pull.gone{opacity:0!important;transform:scale(1.4);transition:opacity .25s,transform .3s}
.sc-pull.back{opacity:0!important;transition:opacity .15s}
.sc{position:fixed;inset:0;z-index:95;background:#0B0B0D;color:#fff;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none;animation:sv-in .2s ease-out}
.sc-top{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sc-top .sp,.sc-et .sp{flex:1}
.sc-b{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:800;padding:8px 12px}
.sc-b svg{width:18px;height:18px;stroke:#fff}
.sc-b b{font-size:15px;font-weight:900}
.sc-x{padding:8px}.sc-x svg{width:22px;height:22px}
.sc-dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.sc-phs{position:absolute;inset:0;z-index:3;pointer-events:none}
.sc-ph{position:absolute;width:78%;max-height:85%;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:16px;border:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.14);color:#fff;overflow:hidden;animation:ph-in .3s cubic-bezier(.2,1.3,.4,1) both;transition:opacity .4s,border-color .3s}
.sc-ph::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);background-size:250% 100%;animation:ph-sh 1.4s linear infinite}
.sc-ph.ok{border-color:#2EBD6B;border-style:solid}
.sc-ph.ok::before,.sc-ph.ng::before{display:none}
.sc-ph.ng{border-color:#E5484D;border-style:solid}
.sc-ph.out{opacity:0}
.sc-ph small{position:relative;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);white-space:nowrap}
.sc-ph .sc-ld{background:rgba(0,0,0,.55);box-shadow:0 4px 14px rgba(0,0,0,.35)}
@keyframes ph-in{from{opacity:0;scale:.85}}
@keyframes ph-sh{from{background-position:120% 0}to{background-position:-120% 0}}
.sc-load{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(0,0,0,.45);animation:sv-m .2s ease-out;transition:opacity .3s}
.sc-load.out{opacity:0}
.sc-ld-in{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 22px;border-radius:20px;background:rgba(20,20,24,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
.sc-ld-in b{font-size:14px;font-weight:800}
.sc-ld-row{display:flex;gap:12px}
.sc-ld{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#2a2a30 center/cover no-repeat}
.sc-ld svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sc-ld circle{fill:none;stroke-width:3.5}
.sc-ld .bg{stroke:rgba(255,255,255,.18)}
.sc-ld .fg{stroke:#3D8BEF;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - 100*var(--p,0));transition:stroke-dashoffset .35s ease,stroke .3s}
.sc-ld i{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:background .25s,transform .3s cubic-bezier(.2,1.6,.4,1)}
.sc-ld i svg{position:static;width:18px;height:18px;transform:none;stroke:rgba(255,255,255,.5);stroke-width:3;fill:none}
.sc-ld:not([style*="--p"]) .fg{opacity:0}
.sc-ld.ok .fg{stroke:#2EBD6B}
.sc-ld.ok i{background:#2EBD6B;transform:scale(1.1)}
.sc-ld.ok i svg{stroke:#fff}
.sc-ld.ng .fg{stroke:#E5484D}
.sc-bgs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 12px 10px;animation:sv-m .2s ease-out}
.sc-bgs[hidden]{display:none}
.sc-sw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.7);padding:0}
.sc-sw.on{border:3px solid #fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);transform:scale(1.12)}
.sc-mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sc-stage{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sc-p{position:absolute;max-width:none;touch-action:none;cursor:grab;will-change:transform;-webkit-user-drag:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sc-p.del{opacity:.45}
.sc-layers{touch-action:none}
.sc-layers{position:absolute;inset:0}
.sc-t{position:absolute;touch-action:none;cursor:grab;white-space:pre;line-height:1.3;will-change:transform}
.sc-t span{display:block;padding:.06em .1em;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.sc-t.box span{padding:.25em .45em;border-radius:.35em;text-shadow:none}
.sc-t.del{opacity:.45}
.sc-hint{position:absolute;left:0;right:0;top:46%;margin:0;text-align:center;color:rgba(255,255,255,.85);font-weight:800;font-size:15px;pointer-events:none}
.sc-trash{position:absolute;left:50%;bottom:18px;width:52px;height:52px;margin-left:-26px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s,background .15s;pointer-events:none}
.sc-trash svg{width:24px;height:24px;stroke:#fff}
.sc.dragging .sc-trash{opacity:1;transform:scale(1)}
.sc-trash.hit{background:#FF3040;border-color:#FF3040;transform:scale(1.2)}
.sc-bot{display:flex;align-items:center;gap:10px;padding:8px 12px calc(16px + var(--gb,0px) + env(safe-area-inset-bottom,0px))}
.sc-bot small{flex:1;font-size:11px;color:rgba(255,255,255,.65);line-height:1.5}
.sc-go{flex:none;border:0;border-radius:999px;background:#fff;color:#111;font-weight:900;font-size:14px;padding:12px 18px}
/* 文字を書く画面 */
.sc-ed{position:fixed;left:0;right:0;top:0;height:100%;z-index:2;background:rgba(0,0,0,.6);display:flex;flex-direction:column;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sc-ed[hidden]{display:none}
.sc.editing .sc-top,.sc.editing .sc-bot,.sc.editing .sc-hint,.sc.editing .sc-bgs{visibility:hidden}
.sc.editing .sc-ed{background:rgba(0,0,0,.72)}
.sc-et{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sc-b.on{background:#fff;color:#111}
.sc-done{border:0;background:none;color:#fff;font-size:16px;font-weight:900;padding:8px 6px}
.sc-ew{order:2;flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 16px 0 48px}
.sc-size{position:absolute;left:-58px;top:50%;margin-top:-10px;width:150px;transform:rotate(-90deg);accent-color:#fff}
.sc-ebox{width:100%;display:flex;justify-content:center}
.sc-in{width:100%;max-width:420px;border:0;outline:none;resize:none;background:transparent;line-height:1.3;padding:.2em .4em;border-radius:.35em;caret-color:#fff;-webkit-user-select:text;user-select:text;overflow:hidden}
.sc-in::placeholder{color:rgba(255,255,255,.6)}
.sc-cols{order:1;flex:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 12px 6px}
.sc-col{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--c);padding:0}
.sc-col.on{transform:scale(1.3);border-width:3px;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 0 5px #fff}
.sc-cur{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff}
.sc-cur i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:var(--c)}
.st-prev{position:relative;border:0;padding:0;width:100%;border-radius:14px;overflow:hidden;background:var(--sub);display:grid;place-items:center;min-height:200px;max-height:48vh;color:var(--ink3)}
.st-prev.has{background:#000}
.st-prev img{max-width:100%;max-height:48vh;display:block}
.st-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px}
.st-empty svg{width:34px;height:34px;stroke-width:2.2;color:var(--blue)}
.st-empty b{color:var(--ink);font-size:15px}
.st-empty small{font-size:12px}
.st-chg{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px}
.st-cap,.sv-cap{position:absolute;left:12px;right:12px;bottom:14px;margin:0;text-align:center;color:#fff;font-weight:800;font-size:16px;line-height:1.5;background:rgba(0,0,0,.5);border-radius:12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word}
.st-txtcard,.sv-card{display:grid;place-items:center;width:100%;min-height:200px;background:linear-gradient(140deg,#7B2FF7,#E1306C 55%,#FCAF45);color:#fff;font-weight:900;font-size:22px;line-height:1.5;text-align:center;padding:24px;white-space:pre-wrap;word-break:break-word}
.sv-card{height:100%;font-size:28px;padding:40px 28px}
.sv-card p{margin:0}
.sv-cap{bottom:12px;font-size:17px}
/* 下のコメント欄（インスタのように、枠だけの丸い入力欄と送信） */
.sv-foot{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px calc(34px + var(--gb,0px) + env(safe-area-inset-bottom,0px))}
.sv-inp{flex:1;min-width:0;height:46px;border-radius:999px;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.18);color:#fff;padding:0 18px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.sv-inp::placeholder{color:rgba(255,255,255,.85)}
.sv-inp:focus{background:rgba(0,0,0,.45);border-color:#fff}
.sv-send{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.sv-send svg{width:26px;height:26px;stroke:#fff;stroke-width:2}
/* ストーリーの足あと・いいね */
.sv-actrow{flex:none;align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#fff;padding:8px 18px 0;font-size:12px;font-weight:700}
.sv-actrow .cnt{display:flex;align-items:center;gap:5px;font-size:14px}
.sv-actrow .cnt .lk{margin-left:8px;display:inline-flex}
.sv-actrow svg{width:17px;height:17px;stroke:#fff;stroke-width:2;fill:none}
.sv-actrow .lk svg{fill:#fff}
.sv-actrow small{font-size:11px;color:rgba(255,255,255,.7)}
.sv-actrow .up{width:9px;height:9px;border-left:2px solid #fff;border-top:2px solid #fff;transform:rotate(45deg);margin-bottom:2px;animation:sv-up 1.4s ease-in-out infinite}
@keyframes sv-up{0%,100%{transform:translateY(2px) rotate(45deg);opacity:.5}50%{transform:translateY(-2px) rotate(45deg);opacity:1}}
.sv-like{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.sv-like svg{width:28px;height:28px;stroke:#fff;stroke-width:2;fill:none}
.sv-like.on svg{fill:var(--heart);stroke:var(--heart);animation:sv-pop .35s ease-out}
@keyframes sv-pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.sv-sheet{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:5;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.4);animation:svs-in .26s cubic-bezier(.22,.8,.3,1);-webkit-user-select:none;user-select:none}
.sv-sheet.out{animation:svs-out .2s ease-in forwards}
@keyframes svs-in{from{transform:translateY(100%)}}
@keyframes svs-out{to{transform:translateY(100%)}}
.svs-grab{flex:none;width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.svs-h{flex:none;display:flex;align-items:center;gap:14px;padding:4px 6px 10px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.svs-h>span{display:inline-flex;align-items:center;gap:6px}
.svs-h svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.svs-lk svg{fill:var(--heart);stroke:var(--heart)}
.svs-x{margin-left:auto;border:0;background:none;padding:8px;color:var(--ink);display:grid;place-items:center}
.svs-x svg{width:22px;height:22px}
.svs-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.svs-r{display:flex;align-items:center;gap:12px;padding:9px 16px}
.svs-r .t{flex:1;min-width:0;display:flex;flex-direction:column}
.svs-r b{font-size:14px;font-weight:700}
.svs-r small{font-size:12px;color:var(--ink3)}
.svs-hrt{display:grid}
.svs-hrt svg{width:22px;height:22px;fill:var(--heart);stroke:var(--heart)}
.svs-none{text-align:center;color:var(--ink3);font-size:13px;margin:32px 0}
.sv-none{margin:12px 0;color:var(--ink3);text-align:center;font-size:13px}
/* 見る画面 */
.sv{position:fixed;inset:0;z-index:90;background:#000;display:flex;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;animation:sv-in .22s ease-out}
@keyframes sv-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.sv-in{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
/* スワイプで人を切りかえた時の動き */
.sv-in.sl-next{animation:sv-sl-next .22s ease-out}
.sv-in.sl-prev{animation:sv-sl-prev .22s ease-out}
@keyframes sv-sl-next{from{transform:translateX(70px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sv-sl-prev{from{transform:translateX(-70px);opacity:.3}to{transform:none;opacity:1}}
.sv-media{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:0 0 16px 16px}
.sv-media>img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.sv-media .sv-card{height:100%}
/* チャット：画像の下。新しいものが下、上下にスクロール */
.sv-chat{flex:none;max-height:26vh;min-height:52px;overflow-y:auto;overscroll-behavior:contain;padding:10px 14px 4px;display:flex;flex-direction:column;gap:9px;touch-action:pan-y;-webkit-mask-image:linear-gradient(transparent,#000 14px);mask-image:linear-gradient(transparent,#000 14px)}
.sv-m{display:flex;align-items:flex-start;gap:8px;color:#fff;animation:sv-m .25s ease-out}
@keyframes sv-m{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sv-m p{margin:0;font-size:14px;line-height:1.5;word-break:break-word;-webkit-user-select:text;user-select:text}
.sv-m b{font-weight:800;margin-right:6px}
.sv-chat .sv-none{margin:6px 0;color:rgba(255,255,255,.6);font-size:13px;text-align:center}
.sv-bars{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:2}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars i.on b{width:100%}
.sv-bars b{display:block;height:100%;width:0;background:#fff}
.sv-bars b.run{animation:sv-run linear forwards}
.sv.hold .sv-bars b.run{animation-play-state:paused}
@keyframes sv-run{to{width:100%}}
.sv-h{position:absolute;left:12px;right:8px;top:calc(22px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;color:#fff;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.sv-h small{opacity:.8;font-size:12px}
.sv-h .sp{flex:1}
.sv-pf{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;color:#fff;padding:0;font:inherit;text-shadow:inherit;cursor:pointer}
.sv-pf:active{opacity:.7}
.sv-pf b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-mpf{flex:none;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sv-mpf:active{opacity:.6}
.sv-mnm{font-weight:800;margin-right:6px}
.sv-cf{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.55);animation:sv-cf-bg .18s ease-out}
.sv-cf.out{opacity:0;transition:opacity .18s}
.sv-cf-in{width:min(300px,100%);border-radius:18px;background:var(--card);color:var(--ink);text-align:center;padding:22px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:sv-cf-pop .24s cubic-bezier(.2,1.3,.4,1)}
.sv-cf-th{display:block;width:64px;height:100px;object-fit:cover;border-radius:10px;margin:0 auto 12px}
.sv-cf-in b{display:block;font-size:16px;font-weight:800}
.sv-cf-in p{margin:8px 0 16px;font-size:13px;line-height:1.6;color:var(--ink2)}
.sv-cf-b{display:flex;gap:10px}
.sv-cf-b button{flex:1;height:44px;border:0;border-radius:12px;font:inherit;font-size:14px;font-weight:800;transition:transform .12s}
.sv-cf-b button:active{transform:scale(.96)}
.sv-cf-no{background:var(--sub);color:var(--ink)}
.sv-cf-ok{background:var(--late);color:#fff}
@keyframes sv-cf-bg{from{opacity:0}}
@keyframes sv-cf-pop{from{opacity:0;transform:scale(.9)}}
.sv-dl{border:0;background:rgba(255,255,255,.18);color:#fff;height:32px;padding:0 12px 0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;margin-right:4px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .15s,background .15s}
.sv-dl:active{transform:scale(.92);background:rgba(255,255,255,.3)}
.sv-dl svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2;fill:none}
.sv.drag .sv-in{will-change:transform;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sv-x,.sv-del{border:0;background:none;color:#fff;padding:8px;font-size:13px;font-weight:700}
.sv-x svg{width:24px;height:24px;stroke:#fff}
@media (prefers-reduced-motion:reduce){.sv{animation:none}}

/* 顔（頭文字） */
.av{display:grid;place-items:center;border-radius:50%;background:var(--pc);color:#fff;font-family:var(--f-mincho);font-weight:800;flex:none;overflow:hidden}
.s20{width:20px;height:20px;font-size:10px}.s28{width:28px;height:28px;font-size:13px}.s40{width:40px;height:40px;font-size:17px}.s68{width:100%;height:100%;font-size:26px}.s88{width:88px;height:88px;font-size:34px}
.avr{padding:2px;border-radius:50%;flex:none}
.avr .av{border:2px solid var(--card)}
.al-n{margin:4px 16px 8px;font-size:13px;color:var(--ink3)}
.alist{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}

@keyframes pop-on{0%{transform:scale(.2) rotate(0)}30%{transform:scale(1.7) rotate(-14deg)}45%{transform:scale(1.25) rotate(10deg)}60%{transform:scale(1.45) rotate(-6deg)}78%{transform:scale(.92) rotate(2deg)}100%{transform:scale(1) rotate(0)}}

/* はじける粒：ページに貼りつけて、スクロールしても置いていかれないように */
.pop-fx{position:absolute;z-index:60;width:0;height:0;pointer-events:none}
.pop-fx .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:fx-ring .6s ease-out}

.pop-fx .fly{position:absolute;left:-8px;top:-8px;width:16px;height:16px;opacity:0;animation:fx-fly 1.1s cubic-bezier(.2,.7,.3,1)}

.pop-fx .dot{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:0;animation:fx-dot .75s cubic-bezier(.1,.8,.3,1)}
.pop-fx.heart{--c:var(--heart,#ED4956)} .pop-fx.mark{--c:#F5C518}
@keyframes fx-ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes fx-ring2{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.8);opacity:0}}

@media (prefers-reduced-motion:reduce){.acts svg.pop-on,.acts svg.pop-off{animation:none!important}.pop-fx{display:none}}

/* 達成率（わくわく版） */
.prog2{padding:14px 16px 4px;--c1:color-mix(in srgb,var(--sc) 55%,#fff);--c2:var(--sc)}
.prog2.full{--c1:#FFD54A;--c2:#F77737}

.p2-lab{position:relative;overflow:hidden;box-shadow:0 0 0 0 transparent}
.p2-lt{position:relative;z-index:1}
.p2-lab::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-120%);animation:p2-sweep 3s ease-in-out 2.2s infinite}
/* 言葉ごとの動き：--lin＝出てくる時、--lloop＝そのあとずっと */
.prog2{--lin:p2-lab;--lloop:p2-glow;--ldur:2.4s;--lease:ease-in-out}
.prog2.s0{--lin:in-wait;--lloop:lp-wait;--ldur:2.8s}
.prog2.s1{--lin:in-sprout;--lloop:lp-breathe;--ldur:3s}
.prog2.s2{--lin:in-fire;--lloop:lp-flicker;--ldur:.9s;--lease:linear}
.prog2.s3{--lin:in-push;--lloop:lp-nudge;--ldur:1.8s}
.prog2.s4{--lin:in-zoom;--lloop:lp-beat;--ldur:1.1s}
.prog2.s5{--lin:in-jump;--lloop:lp-bounce;--ldur:1.2s}
.prog2.run .p2-lab{animation:var(--lin) 1s cubic-bezier(.2,1.6,.35,1) .85s both}
.p2-lab.hit{animation:var(--lin) 1s cubic-bezier(.2,1.6,.35,1) both,var(--lloop) var(--ldur) var(--lease) 1s infinite!important}
.prog2.still .p2-lab{animation:var(--lloop) var(--ldur) var(--lease) infinite}
.prog2.s1 .p2-lab{transform-origin:50% 100%}
.prog2.s5 .p2-lab{color:#fff;background:linear-gradient(90deg,#F77737,#ED4956,#8E4BD1,#3D8BEF,#2E8B57,#F77737);background-size:300% 100%}
.prog2.s5 .p2-lab .p2-lt{animation:none}
.prog2.s5.run .p2-lab,.prog2.s5.still .p2-lab{background-position:0 0}
.prog2.s5 .p2-lab::before{content:"";position:absolute;inset:0;background:inherit;background-size:300% 100%;animation:rainbow 3s linear infinite;z-index:0}
@keyframes rainbow{to{background-position:300% 0}}
/* これから！：そわそわ左右にゆれて待っている */
@keyframes in-wait{0%{transform:translateX(-24px);opacity:0}50%{transform:translateX(6px) rotate(4deg);opacity:1}75%{transform:translateX(-3px) rotate(-3deg)}100%{transform:none;opacity:1}}
@keyframes lp-wait{0%,40%,100%{transform:none}48%{transform:rotate(-7deg)}56%{transform:rotate(7deg)}64%{transform:rotate(-4deg)}72%{transform:none}}
/* スタートしました：芽が出るように下からにょきっと伸びる */
@keyframes in-sprout{0%{transform:scale(1,0);opacity:0}45%{transform:scale(.9,1.45);opacity:1}65%{transform:scale(1.12,.88)}82%{transform:scale(.97,1.05)}100%{transform:none;opacity:1}}
@keyframes lp-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 transparent}50%{transform:scale(1.05);box-shadow:0 0 12px color-mix(in srgb,var(--c2) 40%,transparent)}}
/* いい調子：火がつくように下から燃え上がり、ずっとゆらゆら */
@keyframes in-fire{0%{transform:translateY(16px) scale(.4);opacity:0;filter:brightness(2)}40%{transform:translateY(-8px) scale(1.35) skewX(-6deg);opacity:1}60%{transform:scale(.95) skewX(5deg)}80%{transform:scale(1.08) skewX(-2deg)}100%{transform:none;opacity:1;filter:none}}
@keyframes lp-flicker{0%,100%{transform:none;box-shadow:0 0 8px color-mix(in srgb,var(--c2) 35%,transparent)}25%{transform:scale(1.04,.97) skewX(-3deg);box-shadow:0 -2px 14px color-mix(in srgb,var(--c2) 55%,transparent)}50%{transform:scale(.98,1.04) skewX(2deg)}75%{transform:scale(1.03) skewX(-1deg);box-shadow:0 -4px 16px color-mix(in srgb,var(--c2) 50%,transparent)}}
/* あと少し！：左から勢いよく押し込んで、ときどき前へぐいっ */
@keyframes in-push{0%{transform:translateX(-60px) skewX(20deg);opacity:0}45%{transform:translateX(10px) skewX(-12deg);opacity:1}60%{transform:translateX(-6px) skewX(6deg)}75%{transform:translateX(4px)}88%{transform:translateX(-2px)}100%{transform:none;opacity:1}}
@keyframes lp-nudge{0%,55%,100%{transform:none}65%{transform:translateX(6px) skewX(-8deg)}75%{transform:translateX(-3px)}85%{transform:translateX(4px) skewX(-4deg)}93%{transform:none}}
/* ゴール目前！：大きく迫ってきて、ドキドキ脈打つ */
@keyframes in-zoom{0%{transform:scale(2.6);opacity:0;filter:blur(3px)}50%{transform:scale(.85);opacity:1;filter:none}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes lp-beat{0%,60%,100%{transform:scale(1);box-shadow:0 0 0 0 transparent}12%{transform:scale(1.16);box-shadow:0 0 0 5px color-mix(in srgb,var(--c2) 22%,transparent)}24%{transform:scale(1)}36%{transform:scale(1.12);box-shadow:0 0 16px color-mix(in srgb,var(--c2) 55%,transparent)}}
/* 達成！：くるっと回ってジャンプ、ずっとぴょんぴょん＋虹色 */
@keyframes in-jump{0%{transform:translateY(24px) scale(.3) rotate(-360deg);opacity:0}50%{transform:translateY(-18px) scale(1.4) rotate(10deg);opacity:1}70%{transform:translateY(0) scale(.92)}85%{transform:translateY(-6px) scale(1.06)}100%{transform:none;opacity:1}}
@keyframes lp-bounce{0%,50%,100%{transform:translateY(0)}20%{transform:translateY(-6px) scale(1.06)}35%{transform:translateY(0) scale(.97,1.03)}}
@keyframes p2-lab{0%{transform:translateY(10px) scale(.2) rotate(-12deg);opacity:0}35%{transform:translateY(-6px) scale(1.45) rotate(6deg);opacity:1}55%{transform:scale(.9) rotate(-4deg)}72%{transform:scale(1.15) rotate(2deg)}86%{transform:scale(.97)}100%{transform:none;opacity:1}}
@keyframes p2-glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c2) 0%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c2) 18%,transparent),0 0 14px color-mix(in srgb,var(--c2) 45%,transparent);transform:scale(1.06)}}
@keyframes p2-sweep{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
.pop-fx.lab .spk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;opacity:0;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .7s ease-out both}
@keyframes spk{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.3) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
.p2-num{font-size:22px;font-weight:900;line-height:1;color:var(--c2);letter-spacing:-.02em}
.p2-num small{font-size:12px;font-weight:800;margin-left:1px}
.prog2.full .p2-num{background:linear-gradient(90deg,#F77737,#ED4956,#8E4BD1);-webkit-background-clip:text;background-clip:text;color:transparent}
.p2-bar{position:relative;height:12px;border-radius:999px;background:var(--sub);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.p2-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 1%);border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2));overflow:hidden;box-shadow:0 0 10px color-mix(in srgb,var(--c2) 45%,transparent)}
.prog2.ready:not(.run):not(.still) .p2-fill{width:0}
.prog2.run .p2-fill{animation:p2-grow 1.1s cubic-bezier(.22,1,.36,1) both}
.p2-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:p2-shine 2.2s linear infinite}
.p2-fill::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px);animation:p2-stripe 1s linear infinite}

.bar{flex:1;height:7px;border-radius:999px;background:var(--sub);overflow:hidden}

/* タイムライン：着手した日から期限までを横の棒で（未着手は期限の日だけ）。1日＝28px。左に役員とタスク名、縦の赤い線が今日 */
function tlHtml(src){
  const list = (src||VT()).filter(t=>S.tlDone || t.status!=='done').sort((a,b)=>new Date(a.due)-new Date(b.due));
  if (!list.length) return '<p class="empty">表示するタスクはありません</p>';

  const n = Math.round((hi-lo)/DAY)+1, x = d => Math.round((new Date(d)-lo)/DAY)*W;
  const days = Array.from({length:n}, (_,i)=>new Date(+lo+i*DAY));
  const head = days.map(d=>`<span class="tl-d ${d.getDay()%6===0?'we':''} ${iso(d)===iso(TODAY)?'today':''}">${d.getDate()===1||+d===+lo?`<em>${d.getMonth()+1}月</em>`:''}${d.getDate()}<small>${WD[d.getDay()]}</small></span>`).join('');
  const rows = list.map(t=>{ const e = EP(t.owner), k = stOf(t), st = STATUS[k], s0 = startOf(t), l = x(s0||t.due), w = Math.max(x(t.due)-l+W, W);
    return `<div class="tl-row"><button class="tl-lab" data-open="${t.id}">${av(e,'s28')}<span><b>${esc(t.title)}</b><small>${esc(e.name.split(' ')[0])}・${st.l}</small></span></button>
      <div class="tl-tr">${s0 ? `<button class="tl-bar ${k}" data-open="${t.id}" style="left:${l}px;width:${w}px;--sc:${st.c}" aria-label="${esc(t.title)} ${md(s0)}から${md(t.due)} ${t.prog}%"><i style="width:${t.prog}%"></i><span>${t.prog}%</span></button>`
        : `<button class="tl-bar tl-pin ${k}" data-open="${t.id}" style="left:${l}px;width:${W}px;--sc:${st.c}" aria-label="${esc(t.title)} まだ着手していません 期限${md(t.due)}"></button>`}
        <span class="tl-due ${k}" style="left:${l+w+4}px">〆${md(t.due)}</span></div></div>`; }).join('');
  return `<div class="tl-tools"><div class="legend">${['todo','doing','late','done'].map(k=>`<span><i style="background:${STATUS[k].c}"></i>${STATUS[k].l}</span>`).join('')}</div>

      ${rows}<span class="tl-now" style="left:calc(var(--lab) + ${x(TODAY)+W/2}px)" aria-hidden="true"></span></div></div>`;
}

    })
