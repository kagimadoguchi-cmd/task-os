<style>
/* 携帯：上に細い見出し・下に5つのアイコン／PC（900px〜）：左にメニュー、真ん中に流れる投稿。インスタの並びを役員のタスク管理に */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --sub:#F2F3F5; --line:#E4E6EA; --ink:#121417; --ink2:#4A4F57; --ink3:#8B919A;
  --blue:#3D8BEF; --blue-ink:#FFFFFF; --heart:#E5484D; --badge:#E04B4B; --verify:#3D8BEF;
  --done:#2E8B57; --done-bg:#E3F2EA; --doing:#2F6FD6; --doing-bg:#E5EEFB; --todo:#6B7280; --todo-bg:#EEF0F3; --late:#D23B2E; --late-bg:#FBE7E4;
  --ring:linear-gradient(45deg,#F9C164 0%,#F0884A 30%,#D94C7A 62%,#8E4BD1 100%);
  --logo:linear-gradient(135deg,#8E4BD1 0%,#D94C7A 45%,#F0A04A 100%);
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --card:#141518; --sub:#1E2024; --line:#2A2D33; --ink:#F1F2F4; --ink2:#C2C6CD; --ink3:#868C95;
  --done-bg:#16301F; --doing-bg:#152440; --todo-bg:#1E2125; --late-bg:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
/* 達成のお祝い（5回タップ） */
.p2-lab.cele-bump{animation:cele-bump .35s cubic-bezier(.2,1.8,.4,1)!important}
@keyframes cele-bump{0%{transform:scale(1)}40%{transform:scale(calc(1.1 + var(--n,1) * .06)) rotate(calc(var(--n,1) * 3deg))}100%{transform:scale(1)}}
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;animation:cele-in .35s ease-out both}
.cele.out{animation:cele-out .45s ease-in forwards}
@keyframes cele-in{from{opacity:0}to{opacity:1}}
@keyframes cele-out{to{opacity:0;transform:scale(1.05)}}
.cele-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(52,26,96,.94),rgba(10,6,24,.97));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cele-rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.12) 0 9deg,transparent 9deg 22deg);animation:cele-spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%)}
@keyframes cele-spin{to{transform:rotate(360deg)}}
.cele-conf{position:absolute;inset:0;pointer-events:none}
.cf2{position:absolute;top:-24px;width:var(--w);height:calc(var(--w) * .55);background:var(--c);opacity:0;animation-name:cf2-fall;animation-timing-function:cubic-bezier(.25,.6,.45,1);animation-fill-mode:forwards;animation-iteration-count:1}
.cf2.c{border-radius:50%;height:var(--w)}
.cf2.s{height:calc(var(--w) * 1.6);width:calc(var(--w) * .4);border-radius:2px}
@keyframes cf2-fall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.fw{position:absolute;width:0;height:0;animation:fw-go 1.2s ease-out both}
.fw i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;animation:fw-p 1.2s cubic-bezier(.1,.7,.3,1) both}

/* 文字のコピー・調べる などはできないように（コメントの文と入力欄だけはできる） */

/* カードを押したとき：指の方へ少し傾いて浮き上がり（大きくなる）、指の下が光る。離すと波紋が広がって、ぽよんと弾んで戻る */
.panel,.co-c,.al-row{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,1.5,.35,1),box-shadow .35s;will-change:transform;--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--tc:var(--sc,#3D8BEF)}
.co-c{--tc:var(--cc)}
.panel.pressing,.co-c.pressing,.al-row.pressing{transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.06) translateY(-2px);transition:transform .16s ease-out,box-shadow .16s;box-shadow:0 16px 34px color-mix(in srgb,var(--tc) 38%,transparent),0 4px 10px rgba(0,0,0,.08)}
.tap-shine{position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:3;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 22%,transparent 55%)}
.pressing>.tap-shine{opacity:1}
.tap-rip{position:absolute;z-index:2;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 45%,#fff) 0%,color-mix(in srgb,var(--tc) 30%,transparent) 45%,transparent 70%);animation:tap-rip .7s cubic-bezier(.2,.7,.3,1) forwards}
.co-c .tap-rip{background:radial-gradient(circle,rgba(255,255,255,.7) 0%,rgba(255,255,255,.25) 45%,transparent 70%)}
.tap-ring{position:absolute;z-index:2;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;border:2px solid color-mix(in srgb,var(--tc) 60%,#fff);animation:tap-ring .6s ease-out forwards}
.card-pop{animation:card-pop .6s cubic-bezier(.2,1.5,.35,1)}
@keyframes tap-rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(14);opacity:0}}
@keyframes tap-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
@keyframes card-pop{0%{transform:perspective(700px) scale(1.06)}30%{transform:perspective(700px) scale(.96)}55%{transform:perspective(700px) scale(1.03)}78%{transform:perspective(700px) scale(.995)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.co-c,.al-row{transition:none}.pressing{transform:none!important}.tap-rip,.tap-ring,.card-pop{animation:none!important;display:none}}
html{overscroll-behavior-y:contain}
/* 引っぱって更新：丸い目盛り＋ひとことの札 */
/* 外側は画面の横いっぱい（真ん中寄せだけ）。札（.ptr-in）は文の長さに合わせて広がるので、文が枠からはみ出さない */
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:15;display:flex;justify-content:center;padding:0 16px;opacity:0;transform:translateY(0) scale(.82);transform-origin:50% 0;pointer-events:none;will-change:transform,opacity}
.ptr-in{display:inline-flex;align-items:center;flex:none;max-width:100%;padding:5px 16px 5px 5px;border-radius:999px;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.14),0 0 0 1px var(--line);white-space:nowrap;transition:background .25s,box-shadow .25s}
.ptr-ic{margin-right:9px}
.ptr-t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ptr.back{transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.ptr-ic{position:relative;width:34px;height:34px;display:grid;place-items:center;flex:none}
.ptr-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ptr-ring circle{fill:none;stroke-width:3}
.ptr-ring .bgc{stroke:var(--sub)}
.ptr-ring .fg{stroke:url(#ptrg);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .05s linear}
.ptr-arrow,.ptr-ok{position:absolute;width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ptr-arrow{stroke:var(--ink2);transform:rotate(calc(var(--k,0) * 180deg));transition:transform .2s}
.ptr-ok{stroke:#fff;opacity:0;stroke-dasharray:1;stroke-dashoffset:1}
.ptr-t{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
/* いっぱいまで引いた */
.ptr.ready .ptr-in{background:linear-gradient(90deg,#3D8BEF,#8E4BD1);box-shadow:0 8px 24px rgba(91,90,230,.45)}
.ptr.ready .ptr-t{color:#fff}
.ptr.ready .ptr-arrow{stroke:#fff;transform:rotate(180deg)}
.ptr.ready .ptr-ring .bgc{stroke:rgba(255,255,255,.3)}
.ptr.ready .ptr-ring .fg{stroke:#fff}
.ptr.ready .ptr-ic{animation:ptr-pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes ptr-pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
/* 更新中 */
.ptr.spin .ptr-in{background:linear-gradient(90deg,#3D8BEF,#8E4BD1,#3D8BEF);background-size:200% 100%;animation:ptr-flow 1.2s linear infinite;box-shadow:0 8px 24px rgba(91,90,230,.45)}
.ptr.spin .ptr-t{color:#fff}
.ptr.spin .ptr-t::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:ptr-dots 1s steps(4) infinite}
.ptr.spin .ptr-arrow{opacity:0}
.ptr.spin .ptr-ring{animation:ptr-rot .8s linear infinite}
.ptr.spin .ptr-ring .bgc{stroke:rgba(255,255,255,.25)}
.ptr.spin .ptr-ring .fg{stroke:#fff;stroke-dashoffset:70!important;transition:none}
@keyframes ptr-rot{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
@keyframes ptr-flow{to{background-position:-200% 0}}
@keyframes ptr-dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* 終わった */
.ptr.done .ptr-in{background:linear-gradient(90deg,#2E8B57,#3BB273);box-shadow:0 8px 24px rgba(46,139,87,.4)}
.ptr.done .ptr-t{color:#fff}
.ptr.done .ptr-arrow{opacity:0}
.ptr.done .ptr-ring{opacity:0}
.ptr.done .ptr-ic{background:rgba(255,255,255,.2);border-radius:50%;animation:ptr-pop .5s cubic-bezier(.2,1.8,.4,1)}
.ptr.done .ptr-ok{opacity:1;animation:ptr-check .45s ease-out forwards}
@keyframes ptr-check{to{stroke-dashoffset:0}}
.ptr-fx{position:absolute;left:50%;top:50%;width:0;height:0}
.ptr-fx i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);animation:ptr-fx .6s ease-out forwards}
@keyframes ptr-fx{0%{transform:rotate(var(--r)) translateY(-10px);opacity:1}100%{transform:rotate(var(--r)) translateY(-30px) scale(.2);opacity:0}}

@media (min-width:900px){.scope-bar{top:0;border-radius:0 0 12px 12px}}
.co-none{margin:0;font-size:12px;color:var(--ink3);-webkit-user-select:none;user-select:none}

.cos{display:grid;gap:8px;padding:0 16px 8px}
/* PCでも管理の事業は縦1列 */
@media (min-width:900px){.cos{grid-template-columns:1fr}}

.u-acc{border-top:1px solid var(--line);margin:0 -14px;padding:0 14px}

.co-exec{box-shadow:inset 4px 0 0 var(--ink),var(--sh)}
.u-n{font-size:12px;color:var(--ink3);white-space:nowrap}
.u-chev{display:grid;place-items:center;transition:transform .2s}
.u-chev svg{width:16px;height:16px}

.u-body{padding:0 0 10px}

.u-t b{font-size:14px}.u-t small{font-size:11px;color:var(--ink3)}
.u-p .pb{height:30px;font-size:12px;padding:0 10px;flex:none}

.vis{display:flex;flex-direction:column;gap:8px}
.vis .lb{font-size:13px;font-weight:700;color:var(--ink2)}
.vis-t{margin:0;font-size:12px;color:var(--ink3);line-height:1.6}
.eo-ck{display:flex;align-items:flex-start;gap:10px;margin:0;padding:12px 14px;border-radius:var(--r-md,12px);background:var(--sub);cursor:pointer}
.eo-ck input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.eo-ck span{display:flex;flex-direction:column;gap:2px}
.eo-ck b{font-size:14px}.eo-ck small{font-size:12px;color:var(--ink3)}
.tg.eo{background:var(--ink);color:var(--card);border-color:var(--ink)}
.eo-m{font-style:normal;font-size:10px;font-weight:800;color:var(--card);background:var(--ink);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.top-gear{width:40px;height:40px;margin-right:-6px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.top-gear svg{width:24px;height:24px}
.top-gear[aria-current="page"]{background:var(--sub)}
.lp-x{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;font-size:12px}
.lp-x svg{width:14px;height:14px}
.pc-gear{display:none}
/* お知らせ（ハート） */
.top-heart{position:relative;width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.top-heart svg{width:27px;height:27px;stroke-width:1.8;stroke-linejoin:round;transition:transform .2s}
.top-heart:active svg{transform:scale(.88)}
/* お知らせを開いている時：赤いグラデーションの線（塗りつぶさない） */
.top-heart[aria-current="page"] svg{stroke:url(#actg);stroke-width:2.3}
/* 未読がある時：ときどき「とくん」と動く */
.top-heart.has-new svg{animation:act-beat 2.8s ease-in-out infinite}
/* ❤を押した時：横にゆらゆら */
.top-heart.wobble svg{animation:act-wob .9s ease-in-out;transform-origin:50% 15%}
@keyframes act-wob{0%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(13deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}90%{transform:rotate(1deg)}100%{transform:rotate(0)}}
@keyframes act-beat{0%,70%,100%{transform:scale(1)}76%{transform:scale(1.14)}82%{transform:scale(.96)}88%{transform:scale(1.08)}}
.act-badge{animation:act-pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes act-pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.top-heart.has-new svg,.top-heart.wobble svg,.act-badge{animation:none}}
.act-badge{position:absolute;top:1px;right:-2px;min-width:19px;height:19px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#FF3040;color:#fff;font-size:11px;font-weight:800;font-style:normal;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.tt-sd .top-heart+.top-gear{margin-left:-4px}
.pc-heart{display:none}
@media (min-width:900px){.pc-heart{display:grid;position:fixed;top:20px;right:24px;z-index:30;width:44px;height:44px}.pc-heart.with-gear{right:76px}.pc-heart:hover{background:var(--sub)}}
.act-mh .sp{flex:1}
.nt-l{font-size:13px;font-weight:700;color:var(--ink3)}
/* 通知のオン・オフ：ベルのアイコン（インスタ風の線画）。オン＝黄色、オフ＝斜線つきで黒（ダークモードでは白） */
.nt-bell{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;padding:0;cursor:pointer;color:var(--ink);transition:background .15s,transform .15s}
.nt-bell:hover{background:var(--sub)}
.nt-bell:active{transform:scale(.9)}
.nt-bell svg{width:28px;height:28px;stroke-width:1.8}
.nt-bell.on{color:#F5B400}
.nt-bell.on svg{fill:rgba(245,180,0,.22)}
.nt-bell.off{color:var(--ink)}
.nt-off{margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:var(--sub);color:var(--ink2);font-size:13px;line-height:1.6}
.act-list{display:flex;flex-direction:column;padding:4px 0 16px}
.act-h{font-size:15px;font-weight:800;margin:14px 16px 4px}
.act-row{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 16px;text-align:left;color:var(--ink);width:100%}
.act-t{flex:1;min-width:0;font-size:14px;line-height:1.5;word-break:break-word}
.act-t small{color:var(--ink3);font-size:13px;margin-left:5px;white-space:nowrap}
.act-mh{border-bottom:1px solid var(--line);padding-bottom:12px}
.act-avs{position:relative;flex:none;width:44px;height:44px}
.act-avs .av{position:absolute;box-shadow:0 0 0 2px var(--bg)}
.act-avs .av:first-child{left:0;top:0}
.act-avs .av:last-child{right:0;bottom:0}
.s44{width:44px;height:44px;font-size:18px;flex:none}
.act-th{flex:none;width:44px;min-width:44px;max-width:44px;height:44px;box-sizing:border-box;border-radius:6px;overflow:hidden;background:var(--sbg);border-left:3px solid var(--sc);display:grid;place-items:center;padding:3px}
.act-th b{font-size:9px;line-height:1.25;color:var(--ink);font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;text-align:center}
.act-th.img{padding:0;border-left:0;background:#000}
.act-th.img img{width:100%;height:100%;object-fit:cover}
.act-th.st{border-left:0;background:linear-gradient(140deg,#7B2FF7,#E1306C 55%,#FCAF45)}
.act-th.st b{color:#fff}
.act-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:60px 32px;text-align:center;color:var(--ink3)}
.act-empty svg{width:56px;height:56px;stroke-width:1.4;color:var(--ink)}
.act-empty b{color:var(--ink);font-size:17px}
@media (min-width:900px){.pc-gear{display:grid;position:fixed;top:20px;right:24px;z-index:30;margin:0;width:44px;height:44px}.pc-gear:hover{background:var(--sub)}}
.tb{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;padding:0;position:relative}

/* PCの左メニュー */
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;width:300px;flex:none;border-right:1px solid var(--line);padding:28px 18px 22px}
  .side .brand{margin:6px 10px 28px}
  .side .brand i{width:40px;height:40px;font-size:22px;border-radius:11px}
  .side .brand b{font-size:24px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:16px;border:0;background:none;border-radius:12px;padding:12px 14px;font-size:17px;text-align:left}
  .side nav button:hover{background:var(--sub)}
  .side nav button[aria-current="page"]{font-weight:900}
  .side nav button[aria-current="page"] svg{stroke-width:2.5}
  .side .reg{margin-top:16px;display:flex;align-items:center;gap:12px;border:0;border-radius:12px;background:var(--blue);color:var(--blue-ink);padding:15px 18px;font-size:17px;font-weight:700}
  .side .foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 10px}
  .top,.bnav{display:none!important}
  .col{padding-bottom:40px}
}

/* 携帯の下のメニュー */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bnav div{max-width:640px;margin:0 auto;height:var(--nav-h);display:flex;justify-content:space-around;align-items:center}
.bnav button{border:0;background:none;width:56px;height:48px;display:grid;place-items:center;padding:0}
.bnav button[aria-current="page"] svg{stroke-width:2.6}
.bnav .add span{width:42px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center}
.bnav .add svg{width:22px;height:22px;stroke-width:2.4}

/* 役員の丸（ストーリー） */
.stories{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:76px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.st .r{position:relative;width:74px;height:74px;border-radius:50%;padding:3px;background:var(--ring)}
.st[aria-pressed="true"] .r{background:var(--blue)}
/* アイコンのまわりの円：いつもゆっくり回って光る */
@property --ra{syntax:"<angle>";inherits:false;initial-value:0deg}
.st .r,.avr{background:conic-gradient(from var(--ra),#7B2FF7 0deg,#E1306C 80deg,#FD1D1D 140deg,#F77737 200deg,#FCAF45 250deg,#FFF3B0 285deg,#FCAF45 310deg,#7B2FF7 360deg);animation:ring-spin 2.4s linear infinite,ring-glow 2.4s ease-in-out infinite}
.st[aria-pressed="true"] .r{background:var(--blue);animation:none}
@keyframes ring-spin{to{--ra:360deg}}
@keyframes ring-glow{0%,100%{box-shadow:0 0 0 0 rgba(225,48,108,0)}50%{box-shadow:0 0 10px 1px rgba(225,48,108,.45)}}
@media (prefers-reduced-motion:reduce){.st .r,.avr{animation:none}}
.st .r>span:first-child{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg)}
.st small{font-size:12px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.st .cnt{position:absolute;right:-1px;bottom:-1px;min-width:24px;height:24px;border-radius:999px;background:var(--badge);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2.5px solid var(--bg);padding:0 5px}
.st .new{display:grid;place-items:center;background:var(--sub);color:var(--ink3)}
.st .new svg{width:28px;height:28px}
.st .plus{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:2.5px solid var(--bg)}
.st .plus svg{width:13px;height:13px;stroke-width:3}
/* ストーリー：自分（左はし）。うすい＋で投稿 */
.st-me{position:relative}
.st-av{border:0;background:none;padding:0;display:block}
.st-av .r{display:block}
.st-add{position:absolute;left:50%;top:0;margin-left:10px;margin-top:48px;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--bg);background:rgba(61,139,239,.55);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.st-add svg{width:14px;height:14px;stroke-width:3}
/* 円：見た＝灰色、ない＝円なし */
.st .r.r-seen,.avr.r-seen{background:var(--line);animation:none}
.st .r.r-none,.avr.r-none{background:transparent;animation:none}
.avr-add{background:rgba(61,139,239,.6)!important;color:#fff}
/* 投稿前の確認 */
/* 自分は左に固定、ほかの人は横にスクロール */
.stories{overflow:hidden}
.st-scroll{display:flex;gap:inherit;flex:1;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:-6px -16px -6px 0;padding:6px 16px 6px 14px;position:relative}
/* 自分（固定）と右側のあいだの、うすい仕切り */
.st-me{padding-right:2px}
.st-solo .st-me::after{display:none}
.st-me::after{content:"";position:absolute;right:-9px;top:8px;bottom:22px;width:1px;background:var(--line)}
.st-scroll::-webkit-scrollbar{display:none}
/* 投稿の画面 */
/* ストーリーを作る画面 */
.sc.sc-slide{animation:none;will-change:transform;box-shadow:16px 0 40px rgba(0,0,0,.45)}
.shell.swiping{position:relative;overflow:hidden;will-change:transform}
/* スワイプ中に画面を暗くする黒い膜。filter（brightness）は毎フレーム描き直しで重くカクつくので、透明度だけで暗くする */
.shell.swiping::after{content:"";position:absolute;inset:0;z-index:999;background:#000;opacity:var(--dim,0);pointer-events:none}
.shell.sw-anim::after{transition:opacity var(--ms,200ms) ease-out}
.sc.sc-slide .sc-hint{opacity:0}
/* スワイプ中の目印（作成画面の右はし） */
.sc-pull{position:absolute;right:16px;top:50%;z-index:5;width:120px;margin-top:-70px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;opacity:0;pointer-events:none;transform:scale(calc(.7 + .3*var(--k,0)))}
.sc-pull i{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#7B2FF7,#E1306C 55%,#FCAF45);box-shadow:0 8px 24px rgba(225,48,108,.45);transform:rotate(calc(-90deg + 90deg*var(--k,0)));transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.sc-pull i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);opacity:0}
.sc-pull i svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6}
.sc-pull b{font-size:16px;font-weight:900;letter-spacing:.04em}
.sc-pull small{font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.sc-pull.ready i{transform:rotate(0) scale(1.15)}
.sc-pull.ready i::after{animation:pull-ring .5s ease-out forwards}
.sc-pull.ready small{color:#fff}
@keyframes pull-ring{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
.sc-pull.gone{opacity:0!important;transform:scale(1.4);transition:opacity .25s,transform .3s}
.sc-pull.back{opacity:0!important;transition:opacity .15s}
.sc{position:fixed;inset:0;z-index:95;background:#0B0B0D;color:#fff;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none;animation:sv-in .2s ease-out}
.sc-top{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sc-top .sp,.sc-et .sp{flex:1}
.sc-b{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:800;padding:8px 12px}

.acts{display:flex;align-items:center;gap:14px;padding:12px 16px 6px}

.acts svg.pop-on{animation:pop-on .75s cubic-bezier(.2,1.4,.4,1)}
.acts svg.pop-off{animation:pop-off .25s ease-out}

@keyframes pop-on{0%{transform:scale(.2) rotate(0)}30%{transform:scale(1.7) rotate(-14deg)}45%{transform:scale(1.25) rotate(10deg)}60%{transform:scale(1.45) rotate(-6deg)}78%{transform:scale(.92) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes pop-off{0%{transform:scale(1)}50%{transform:scale(.75)}100%{transform:scale(1)}}
@keyframes mark-on{0%{transform:translateY(-18px) scale(.4) rotate(-20deg)}35%{transform:translateY(0) scale(1.6,1.35) rotate(8deg)}55%{transform:scale(1.15,.85) rotate(-6deg)}75%{transform:scale(1.2) rotate(3deg)}100%{transform:none}}
/* はじける粒：ページに貼りつけて、スクロールしても置いていかれないように */
.pop-fx{position:absolute;z-index:60;width:0;height:0;pointer-events:none}

.pop-fx .dot{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:0;animation:fx-dot .75s cubic-bezier(.1,.8,.3,1)}

@keyframes fx-ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes fx-ring2{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.8);opacity:0}}

@keyframes fx-dot{0%{transform:rotate(var(--r)) translateY(-6px) scale(1.2);opacity:1}70%{opacity:1}100%{transform:rotate(var(--r)) translateY(calc(var(--d) * -1)) scale(.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.acts svg.pop-on,.acts svg.pop-off{animation:none!important}.pop-fx{display:none}}
.acts .saved svg{fill:#F5C518;stroke:#111}
.tags{display:flex;gap:6px;padding:4px 16px}
.tg{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--ink3)}
.tg.st-s{border:0;background:var(--sbg);color:var(--sc)}
.cap{padding:6px 16px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.cap b{margin-right:6px}
.reply{padding:2px 16px 0 22px;font-size:14px;color:var(--ink3);white-space:pre-wrap}
.cmore{border:0;background:none;padding:4px 16px 0;font-size:13px;color:var(--ink3);text-align:left;display:block;width:100%}
.prog{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}
/* 達成率（わくわく版） */
.prog2{padding:14px 16px 4px;--c1:color-mix(in srgb,var(--sc) 55%,#fff);--c2:var(--sc)}
.prog2.full{--c1:#FFD54A;--c2:#F77737}
.dd-prog .prog2{padding:0}
.p2-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:7px}
.p2-lab{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--c2);background:color-mix(in srgb,var(--c2) 12%,transparent);border-radius:999px;padding:3px 10px}
.p2-lab{position:relative;overflow:hidden;box-shadow:0 0 0 0 transparent}
.p2-lt{position:relative;z-index:1}
.p2-lab::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-120%);animation:p2-sweep 3s ease-in-out 2.2s infinite}
/* 言葉ごとの動き：--lin＝出てくる時、--lloop＝そのあとずっと */
.prog2{--lin:p2-lab;--lloop:p2-glow;--ldur:2.4s;--lease:ease-in-out}
.prog2.s0{--lin:in-wait;--lloop:lp-wait;--ldur:2.8s}
.prog2.s1{--lin:in-sprout;--lloop:lp-breathe;--ldur:3s}
.prog2.s2{--lin:in-fire;--lloop:lp-flicker;--ldur:.9s;--lease:linear}
.prog2.s3{--lin:in-push;--lloop:lp-nudge;--ldur:1.8s}
.prog2.s4{--lin:in-zoom;--lloop:lp-beat;--ldur:1.1s}
.prog2.s5{--lin:in-jump;--lloop:lp-bounce;--ldur:1.2s}
.prog2.run .p2-lab{animation:var(--lin) 1s cubic-bezier(.2,1.6,.35,1) .85s both}
.p2-lab.hit{animation:var(--lin) 1s cubic-bezier(.2,1.6,.35,1) both,var(--lloop) var(--ldur) var(--lease) 1s infinite!important}
.prog2.still .p2-lab{animation:var(--lloop) var(--ldur) var(--lease) infinite}
.prog2.s1 .p2-lab{transform-origin:50% 100%}
.prog2.s5 .p2-lab{color:#fff;background:linear-gradient(90deg,#F77737,#ED4956,#8E4BD1,#3D8BEF,#2E8B57,#F77737);background-size:300% 100%}
.prog2.s5 .p2-lab .p2-lt{animation:none}

.prog2.s5 .p2-lab::before{content:"";position:absolute;inset:0;background:inherit;background-size:300% 100%;animation:rainbow 3s linear infinite;z-index:0}
@keyframes rainbow{to{background-position:300% 0}}
/* これから！：そわそわ左右にゆれて待っている */
@keyframes in-wait{0%{transform:translateX(-24px);opacity:0}50%{transform:translateX(6px) rotate(4deg);opacity:1}75%{transform:translateX(-3px) rotate(-3deg)}100%{transform:none;opacity:1}}

body{background:var(--page);font-size:15px}
.main{background:var(--page)}

.bnav button{border-radius:var(--r-sm)}

.side{background:var(--bg)}

/* 上の丸と絞り込みは、白い面にまとめる */

.chip{height:36px;padding:0 14px;align-items:center;border-radius:999px;font-size:13px}
/* 投稿 */
.feed{gap:16px;padding:16px 0 8px}
.post{border:0;border-radius:var(--r-lg);box-shadow:var(--sh);margin:0 12px}

.panel{margin:0 12px;width:calc(100% - 24px);border-radius:var(--r-md);padding:20px 22px 22px;gap:4px;overflow:hidden;

.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc)}

.panel h3{font-size:16px;line-height:1.5}
.panel .due{font-size:12px;letter-spacing:.02em}
.spill{padding:3px 11px;font-size:12px}
.acts{padding:12px 16px 4px;gap:16px}
.acts svg.i{width:25px;height:25px}
.tags{padding:6px 16px 2px}
.tg{font-size:11px;padding:2px 9px}
.cap{font-size:14px;line-height:1.7;padding-top:6px}
.reply{font-size:13px}
.prog{padding:14px 16px 2px}
.bar{height:6px}
.prog b{font-size:13px}
.pf{margin-top:12px;padding:12px 16px 14px}
.pb{height:38px;padding:0 15px;border-radius:var(--r-sm);font-size:13px}

/* さがす・予定・役員・個人ページ：白い面に入れる */

.hd{font-size:18px}
.lst{background:var(--bg);margin:8px 12px;border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.month{background:var(--bg);margin:8px 12px;border-radius:var(--r-lg);box-shadow:var(--sh);padding:12px}
.month button{border-radius:var(--r-sm)}
.day{background:var(--page)}
.mh{padding:14px 16px 4px}
.prof,.bio,.mybtns,.hls{background:var(--bg)}

.bio{padding-bottom:16px}
.mybtns .pb{height:36px}
.grid{gap:3px;padding:3px;background:var(--bg)}
.cell{border-radius:6px}
.mytabs{background:var(--bg)}
/* シート */
.sheet{border-radius:0 0 var(--r-lg) var(--r-lg);gap:16px}
@media (min-width:900px){.sheet{border-radius:var(--r-lg)}}
.field input,.field textarea,.field select{border-radius:var(--r-sm);background:var(--page)}
.btn{border-radius:var(--r-sm);height:46px;padding:0 16px}
.seg label{padding:7px 14px}
.toast{border-radius:var(--r-sm)}
/* さがす：状態の切り替え。選んだボタンは状態の色 */
/* 折り返して全部見せる（横スクロールだと右端の「完了」が隠れて押せない） */
.sfil{background:none;border-bottom:0;padding:6px 16px 10px;flex-wrap:wrap;overflow:visible}
.sfil .chip[aria-pressed="true"].sc-todo{background:var(--todo);border-color:var(--todo);color:#fff}
.sfil .chip[aria-pressed="true"].sc-late{background:var(--late);border-color:var(--late);color:#fff}
.sfil .chip[aria-pressed="true"].sc-doing{background:var(--doing);border-color:var(--doing);color:#fff}
.sfil .chip[aria-pressed="true"].sc-done{background:var(--done);border-color:var(--done);color:#fff}
.sfil .chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.cell span{font-size:15px;white-space:nowrap;line-height:1.3}
.cell b{font-size:12px;-webkit-line-clamp:4}
/* 下のメニュー：前の版と同じ、浮いた角丸のバー（ぼかしは薄め）。下へスクロールすると小さくなる */
.bnav{left:0;right:0;margin:0 auto;bottom:calc(26px + var(--gb,0px) + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));border-radius:999px;padding:6px;border-top:0;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.42));-webkit-backdrop-filter:blur(6px) saturate(1.4);backdrop-filter:blur(6px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.05);transition:width .25s ease,padding .25s ease}
.bnav div{height:auto;max-width:none}
.bnav button{width:auto;flex:1;height:auto;padding:7px 2px;border-radius:999px;color:var(--ink);transition:padding .25s ease}
.bnav button svg.i{width:28px;height:28px;stroke-width:2;transition:width .25s,height .25s}
.bnav button[aria-current="page"]{background:rgba(0,0,0,.07)}
.bnav button[aria-current="page"] svg{stroke-width:2.5}
.bnav .add{flex:0 0 72px}
.bnav .add span{width:52px;height:38px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 3px 8px rgba(0,0,0,.25);transition:width .25s,height .25s}
.bnav .add:active span{transform:scale(.92)}
.bnav .me .av{width:30px;height:30px;font-size:13px}
.bnav.mini{width:min(440px,calc(100% - 48px));padding:3px}
.bnav.mini button{padding:4px 2px}
.bnav.mini button svg.i{width:23px;height:23px}
.bnav.mini .add span{width:42px;height:30px}
.bnav.mini .me .av{width:24px;height:24px;font-size:11px}
.col{padding-bottom:calc(120px + var(--gb,0px) + env(safe-area-inset-bottom,0px))}

  :root:not([data-theme="light"]) .bnav button[aria-current="page"]{background:rgba(255,255,255,.12)}}
:root[data-theme="dark"] .bnav{background:linear-gradient(180deg,rgba(60,66,70,.58),rgba(30,34,36,.42));border-color:rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
:root[data-theme="dark"] .bnav button[aria-current="page"]{background:rgba(255,255,255,.12)}
@media (min-width:900px){.col{padding-bottom:40px}}
/* 予定：タイムライン */
.vsw{background:none;border-bottom:0;padding:12px 16px 4px}
.tl-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.tl{position:relative;overflow-x:auto;overscroll-behavior-x:contain;margin:0 12px 12px;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh)}
.tl-in{position:relative}
.tl-row{display:flex;align-items:stretch;height:52px;border-top:1px solid var(--line)}

.tl{--lab:150px}
@media (max-width:520px){.tl{--lab:112px}.tl-lab .av{display:none}}
.tl-lab{position:sticky;left:0;z-index:3;width:var(--lab);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border:0;border-right:1px solid var(--line);background:var(--bg);text-align:left;font-size:12px;color:var(--ink3);font-weight:700}
.tl-lab span{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.tl-lab b{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab small{font-size:10px;color:var(--ink3);font-weight:500}
.tl-tr{position:relative;flex:1;display:flex}
.tl-d{position:relative;width:var(--W);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;font-size:11px;font-weight:700;color:var(--ink2)}
.tl-d small{font-size:9px;color:var(--ink3);font-weight:500}
.tl-d.we{background:var(--sub)}
.tl-d.today{color:var(--heart)}
.tl-d em{position:absolute;top:3px;left:2px;font-style:normal;font-size:10px;color:var(--ink);white-space:nowrap}
.tl-bar{position:absolute;top:14px;height:24px;border:0;padding:0;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--sc) 22%,var(--bg));text-align:left}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sc);border-radius:999px}
.tl-bar span{position:relative;padding:0 9px;font-size:10px;font-weight:800;line-height:24px;color:var(--ink)}
.tl-bar.todo{background:repeating-linear-gradient(-45deg,var(--sub) 0 5px,var(--bg) 5px 10px);box-shadow:inset 0 0 0 2px var(--todo)}
.tl-bar.done span,.tl-bar.late span{color:#fff}
.tl-bar.late i{width:100%!important}
.tl-bar.tl-pin{width:24px!important;margin-left:2px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--sc)}
.hint{display:block;margin-top:4px;font-size:12px;color:var(--ink3)}
.tl-due{position:absolute;top:18px;font-size:10px;font-weight:800;color:var(--ink2);white-space:nowrap}
.tl-due.late{color:var(--late)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--heart);z-index:2;pointer-events:none}
/* 状態の背景の絵：うすく、右下に大きく */
.panel>*:not(.wm),.cell>*:not(.wm){position:relative;z-index:1}
.panel .q{position:absolute}
.wm{position:absolute;pointer-events:none;fill:none;stroke:var(--sc);stroke-linecap:round;stroke-linejoin:round;opacity:.13}
.panel .wm{right:-14px;bottom:-26px;width:170px;height:170px;stroke-width:1.6}
.cell .wm{right:-10px;bottom:-12px;width:78px;height:78px;stroke-width:1.8}

:root[data-theme="dark"] .wm{opacity:.2}
/* 入力画面は縦にだけ動く（横にはみ出さない） */
.sheet{overflow-x:hidden;touch-action:pan-y}
.sheet *{min-width:0}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field input,.field textarea,.field select{max-width:100%;min-width:0}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;font-size:15px}
.rng input{min-width:0}
/* ログイン */
.login{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:12vh max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh);padding:28px 24px;display:flex;flex-direction:column;gap:14px}

.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.adm-note{margin:4px 16px 0;font-size:12px;color:var(--ink3)}
.row.adm{align-items:flex-start}
.adm-btns{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.adm-btns .pb{height:32px;font-size:12px;padding:0 12px}

.pf-note{font-size:12px;color:var(--ink3)}

.mytabs.five button small{font-size:11px;color:var(--ink3)}
.mytabs .tb-todo[aria-selected="true"]{color:var(--todo);border-top-color:var(--todo)}
.mytabs .tb-doing[aria-selected="true"]{color:var(--doing);border-top-color:var(--doing)}
.mytabs .tb-late[aria-selected="true"]{color:var(--late);border-top-color:var(--late)}
.mytabs .tb-done[aria-selected="true"]{color:var(--done);border-top-color:var(--done)}
.stats b small{font-size:12px;color:var(--ink3);font-weight:500}
.stats b.over{color:var(--late)}
.mybtns{flex-wrap:wrap}
.mybtns .pb small{margin-left:4px;color:var(--ink3)}
.lk-n{flex:none;min-width:48px;font-weight:700;color:var(--heart)}
.ft-at{color:var(--ink3);white-space:nowrap}
/* 右スワイプで戻る：今の画面を右へ、うしろに前の画面 */
.shell.swiping{position:relative;z-index:20;background:var(--page);box-shadow:-8px 0 24px rgba(0,0,0,.18);will-change:transform}
.peek{position:fixed;inset:0;z-index:19;background:var(--page);overflow:hidden;transform:translateX(-30%);pointer-events:none}
.peek .main{display:flex;justify-content:center}

.cs-empty b{color:var(--ink);font-size:16px}
.cs-in{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.cs-in textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;resize:none;max-height:120px;line-height:1.5;outline:none}
.cs-in button{border:0;background:none;color:var(--blue);font-weight:700;padding:8px 2px;white-space:nowrap}
/* 依頼 */
.bio-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.req-btn{height:34px;font-size:12px;padding:0 12px;flex:none}
.req-btn svg{width:15px;height:15px}
.req-n{background:var(--heart);color:#fff!important;border-radius:999px;padding:0 6px}
.req-list{display:flex;flex-direction:column;gap:12px;padding:12px}
.req-card{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.req-card h3{margin:0;font-size:16px}
.req-card p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--ink2)}
.req-card>small{color:var(--ink3)}
.req-h{display:flex;align-items:center;gap:10px;font-size:13px}
.req-h span:nth-child(2){flex:1;min-width:0;display:block;line-height:1.4}
.req-h span:nth-child(2) small{display:block}
.req-h small{color:var(--ink3);font-size:11px}
.req-to{display:flex;align-items:center;gap:10px;background:var(--sub);border-radius:var(--r-md);padding:10px 12px;font-size:14px}
.dt-del{color:var(--late)!important;flex:0 0 auto!important}
.left{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.left.warn{color:var(--warn,#E08A1E)}
.left.ng{color:var(--late)}
.scrim.cmts .sheet{display:flex;flex-direction:column}
.scrim.cmts .cs-list{flex:1 1 auto;min-height:0}
.scrim.cmts .cs-in{flex:none}
/* 入力欄（下）：画面のふち・claude.ai の案内に隠れないよう、下に余白をとる */
.scrim.cmts .cs-in{padding-top:12px;padding-bottom:calc(44px + var(--gb,0px) + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.scrim.cmts .cs-in{padding-bottom:calc(14px + var(--gb,0px))}}
/* 下のメニュー：ボタンをすべて同じ幅に */
.bnav div{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);justify-items:center}
.bnav button,.bnav .add{flex:none!important;width:100%!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const pwHash = async s => { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tos:' + s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); } catch(e){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); } };

function stDelete(id){ STORIES = STORIES.filter(x=>x.id!==id); saveStLocal(); if (DBX) dbWrite('stories/'+id, ()=>DBX.doc('stories/'+id).delete());
  const cms = STCM.filter(c=>c && c.sid===id).map(c=>c.id); STCM = STCM.filter(c=>!(c && c.sid===id)); try { localStorage.setItem(SCKEY, JSON.stringify(STCM)); } catch(e){}
  if (DBX) cms.forEach(cid=>dbWrite('storycm/'+cid, ()=>DBX.doc('storycm/'+cid).delete())); }
/* 見る画面：上に人ごとのバー。左を押すと前、右を押すと次、長押しで止まる。5秒で次へ。最後まで見ると閉じる
   左にスワイプで次の人（ホーム上の丸い並びの右どなり）、右にスワイプで前の人へ */
/* ストーリーのチャット（全員が見られる・古い順で、新しいものが下） */
let svRefresh = null;
const chatHtml = sid => { const cs = stCmOf(sid); return cs.length ? cs.map(c=>{ const e = E(c.by); return e ? `<div class="sv-m">${av(e,'s28')}<p><b>${esc(e.name)}</b>${esc(c.text)}</p></div>` : ''; }).join('') : '<p class="sv-none">まだコメントはありません</p>'; };
function stOpen(pid){
  const q = Array.from(document.querySelectorAll('.stories [data-sv]')).map(b=>b.dataset.sv).filter(id=>stOfP(id).length);
  let pi = Math.max(0, q.indexOf(pid)); if (!q.includes(pid)) q.splice(0, q.length, pid);
  let list = stOfP(q[pi]), si = Math.max(0, list.findIndex(x=>!STSEEN[x.id]));
  const ov = document.createElement('div'); ov.className = 'sv'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  let down = 0, held = false, sx = 0, sy = 0;
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); if (!document.getElementById('scrim')) document.body.style.overflow = ''; render(); };
  const go = d => { si += d;
    if (si < 0){ if (pi > 0){ pi--; list = stOfP(q[pi]); si = list.length-1; } else si = 0; }
    else if (si >= list.length){ pi++; if (pi >= q.length) return close(); list = stOfP(q[pi]); si = 0; }
    show(); };
  /* 人ごとに飛ばす：次の人はまだ見ていないものから。最後の人の先は閉じる。最初の人より前はその人の1枚目 */
  const goP = d => { const np = pi + d; if (np >= q.length) return close();
    if (np < 0){ si = 0; show('prev'); return; }
    pi = np; list = stOfP(q[pi]); si = Math.max(0, list.findIndex(x=>!STSEEN[x.id])); show(d > 0 ? 'next' : 'prev'); };
  const show = dir => { const x = list[si]; if (!x) return close(); const p = E(x.by); stMarkSeen(x.id);
    ov.innerHTML = `<div class="sv-in"><div class="sv-bars">${list.map((y,i)=>`<i class="${i<si?'on':''}"><b class="${i===si?'run':''}" style="animation-duration:${ST_SEC}s"></b></i>`).join('')}</div>
      <div class="sv-h">${av(p,'s32')}<b>${esc(p.id===S.me?'あなた':p.name)}</b><small>${ago(x.at)}</small><span class="sp"></span>${x.by===S.me?`<button class="sv-del" aria-label="このストーリーを削除">削除</button>`:''}<button class="sv-x" aria-label="閉じる">${ic('x')}</button></div>
      <div class="sv-media">${x.img ? `<img src="${x.img}" alt="${esc(p.name)}のストーリー">${x.txt?`<p class="sv-cap">${esc(x.txt)}</p>`:''}` : `<div class="sv-card"><p>${esc(x.txt)}</p></div>`}</div>
      <div class="sv-chat" aria-live="polite">${chatHtml(x.id)}</div>
      <div class="sv-foot"><input class="sv-inp" type="text" maxlength="200" enterkeyhint="send" placeholder="${x.by===S.me ? 'コメントを書く…' : esc(nick(p))+'さんにコメント…'}" aria-label="コメント"><button class="sv-send" aria-label="送信">${ic('send')}</button></div></div>`;
    ov.querySelector('.run').addEventListener('animationend', ()=>go(1)); const ch = ov.querySelector('.sv-chat'); ch.scrollTop = ch.scrollHeight;
    if (dir) ov.querySelector('.sv-in').classList.add(dir==='next' ? 'sl-next' : 'sl-prev'); };
  /* ほかの人のコメントが届いたら、チャットを描き直す */
  svRefresh = () => { if (!ov.isConnected){ svRefresh = null; return; } const ch = ov.querySelector('.sv-chat'), x = list[si]; if (!ch || !x) return; const end = ch.scrollTop + ch.clientHeight >= ch.scrollHeight - 8; ch.innerHTML = chatHtml(x.id); if (end) ch.scrollTop = ch.scrollHeight; };
  ov.addEventListener('pointerdown', e=>{ if (e.target.closest('.sv-chat')){ ov.classList.add('hold'); return; } if (e.target.closest('button,.sv-foot')) return; down = Date.now(); held = false; sx = e.clientX; sy = e.clientY; ov.classList.add('hold'); });
  ov.addEventListener('pointerup', e=>{ if (e.target.closest('.sv-chat')){ if (!ov.classList.contains('typing')) ov.classList.remove('hold'); return; } if (e.target.closest('button,.sv-foot')) return; if (!ov.classList.contains('typing')) ov.classList.remove('hold');
    /* 横にスワイプ：左へ＝次の人、右へ＝前の人 */
    const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3){ goP(dx < 0 ? 1 : -1); return; }
    if (Date.now()-down > 350){ held = true; return; }
    const rc = ov.getBoundingClientRect(); go(e.clientX - rc.left < rc.width/3 ? -1 : 1); });
  ov.addEventListener('pointercancel', ()=>{ if (!ov.classList.contains('typing')) ov.classList.remove('hold'); });
  /* 入力中・コメントを見ている間は止める */
  const stop = on => { ov.classList.toggle('typing', on); ov.classList.toggle('hold', on); };
  ov.addEventListener('focusin', e=>{ if (e.target.closest('.sv-inp')) stop(true); });
  ov.addEventListener('focusout', e=>{ if (e.target.closest('.sv-inp') && !e.target.value.trim()) stop(false); });
  const send = () => { const i = ov.querySelector('.sv-inp'); if (!i) return; const v = i.value.trim(); if (!v) return;
    const k = piiOf(v); if (k){ toast(`${k}は書き込めません（個人情報のため）`); return; }
    stCmAdd(list[si].id, v); i.value = ''; i.blur(); stop(false); const ch = ov.querySelector('.sv-chat'); if (ch){ ch.innerHTML = chatHtml(list[si].id); ch.scrollTop = ch.scrollHeight; } };
  ov.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.closest('.sv-inp') && !e.isComposing){ e.preventDefault(); send(); } });
  ov.addEventListener('click', e=>{ e.stopPropagation(); if (e.target.closest('.sv-send')) send();
    else if (e.target.closest('.sv-x')) close();
    else if (e.target.closest('.sv-del')){ const x = list[si]; stDelete(x.id); toast('ストーリーを削除しました'); list = stOfP(q[pi]); if (!list.length) return close(); si = Math.min(si, list.length-1); show(); } });
  const key = e => { if (e.target.closest && e.target.closest('.sv-inp')) return; if (e.key==='Escape') close(); else if (e.key==='ArrowRight') go(1); else if (e.key==='ArrowLeft') go(-1); };
  document.addEventListener('keydown', key);
  show();
}

/* ---------- みんなで同じ最新の状態に（共有データ） ----------
   タスク・プロフィール・担当の割りふり・ログイン不可・足あとを共有の置き場に入れる。
   だれかが変えると、ほかの人の画面にもすぐ出る。置き場につながらない時は、今までどおりこの端末の保存で動く */
/* ===== Supabase の設定 =====
   url は Supabase のプロジェクトのもの。key はダッシュボード → Project Settings → API の「anon / publishable」の公開キーを貼る。
   key が空のときは Supabase を使わない。表の作り方は supabase.sql を見る。
   ※ claude.ai のアーティファクトの中では外部への通信が止められているので、そこではアーティファクトの置き場を使う */
const SUPA = { url: 'https://drpslxgqkgjcpabrxuzr.supabase.co', key: 'sb_publishable_lKRsY-VkAPTH_jbu1xiULg_CLCPFxxy' };
/* Supabase を、このアプリが使っている形（collection / doc / onSnapshot / set / delete）に合わせる */
function supaDb(sb){
  const T = 'docs', cache = new Map(), collL = new Map(), docL = new Map(), fails = [];
  const splitP = p => { const i = p.indexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
  const snap = coll => { const m = cache.get(coll) || new Map(), docs = [...m.entries()].map(([id, body]) => ({id, exists:true, data:()=>body})); return {docs, empty:!docs.length, metadata:{fromCache:false}}; };
  const emitColl = coll => (collL.get(coll) || []).forEach(f=>{ try { f(snap(coll)); } catch(e){} });
  const emitDoc = (path, body) => (docL.get(path) || []).forEach(f=>{ try { f({exists:body != null, data:()=>body}); } catch(e){} });
  const mapErr = e => { const err = new Error(e && e.message || 'error'); err.code = (e && (e.code==='42501' || e.status===401 || e.status===403)) ? 'invalid_argument' : /fetch|network/i.test(e && e.message || '') ? 'unavailable' : (e && e.code) || 'unknown'; return err; };
  const push = (m, k, f) => { if (!m.has(k)) m.set(k, []); m.get(k).push(f); };
  let chan = null;
  const live = () => { if (chan) return; chan = sb.channel('docs-live')
    .on('postgres_changes', {event:'*', schema:'public', table:T}, ev=>{
      const r = ev.eventType==='DELETE' ? ev.old : ev.new; if (!r || !r.path) return; const [coll, id] = splitP(r.path);
      if (ev.eventType==='DELETE'){ const m = cache.get(coll); if (m && m.delete(id)) emitColl(coll); emitDoc(r.path, null); return; }
      if (!cache.has(coll)) cache.set(coll, new Map()); cache.get(coll).set(id, r.body); emitColl(coll); emitDoc(r.path, r.body); })
    .subscribe(st=>{ if (st==='CHANNEL_ERROR' || st==='TIMED_OUT') fails.forEach(f=>{ try { f(); } catch(e){} });
      /* つながった（つなぎ直した）時は、その間の変更を取りこぼさないように読み直す */
      if (st==='SUBSCRIBED'){ [...collL.keys()].forEach(c=>load(c).then(()=>emitColl(c)).catch(()=>{}));
        [...docL.keys()].forEach(p=>Promise.resolve(sb.from(T).select('body').eq('path', p).maybeSingle()).then(({data})=>{ if (data) emitDoc(p, data.body); }).catch(()=>{})); } }); };
  const load = coll => Promise.resolve(sb.from(T).select('path,body').eq('coll', coll)).then(({data, error})=>{ if (error) throw mapErr(error);
    const m = new Map(); (data || []).forEach(r=>m.set(splitP(r.path)[1], r.body)); cache.set(coll, m); return snap(coll); });
  return {
    collection: coll => ({
      get: () => load(coll),
      onSnapshot: (cb, fail) => { live(); push(collL, coll, cb); if (fail) fails.push(fail); load(coll).then(cb).catch(()=>{ if (fail) fail(); }); }
    }),
    doc: path => ({
      set: body => { const [coll, id] = splitP(path); return Promise.resolve(sb.from(T).upsert({path, coll, id, body, updated_at:new Date().toISOString()})).then(({error})=>{ if (error) throw mapErr(error); }); },
      delete: () => Promise.resolve(sb.from(T).delete().eq('path', path)).then(({error})=>{ if (error) throw mapErr(error); }),
      onSnapshot: (cb, fail) => { live(); push(docL, path, cb); if (fail) fails.push(fail);
        Promise.resolve(sb.from(T).select('body').eq('path', path).maybeSingle()).then(({data, error})=>{ if (error){ if (fail) fail(); return; } cb(data ? {exists:true, data:()=>data.body} : {exists:false, data:()=>null}); }); }
    })
  };
}
let DBX = null, liveWait = false, roWarned = false;
const SESS_KEY = 'exec-task-board-session-v1', SESS_DAYS = 7; /* 最後に使ってから7日間はログインなしで入れる（ページの更新や開き直しでも続く） */
let PEND_ME = null; /* 前回のログインは有効だが、人の一覧がまだ届いていない時の本人 id。届いたら入る */
const SYNCED = new Map(), PSYNCED = new Map(), DSYNCED = new Map(), CHAIN = new Map();
/* 共有の置き場から最初の中身が届くまでは、こちらから書き込まない（古いキャッシュで上書きしないように） */
const READY = new Set();
const jkey = o => JSON.stringify(o);
/* 同じ置き場への書きこみは1つずつ順番に */
function dbWrite(path, fn){
  const p = (CHAIN.get(path) || Promise.resolve()).then(fn).catch(e=>{
    if (e && e.code==='invalid_argument' && !roWarned){ roWarned = true; toast('見るだけの権限なので、変更はみんなに届きません'); }
    else if (e && e.code==='quota_exceeded') toast('共有の置き場がいっぱいです。管理者に知らせてください');
    else if (e && e.code==='unavailable') setTimeout(()=>{ dbWrite(path, fn); }, 800 + Math.random()*800);
  });
  CHAIN.set(path, p); p.then(()=>{ if (CHAIN.get(path)===p) CHAIN.delete(path); });
}
function pushTasks(){ if (!DBX || !READY.has('tasks')) return;
  const now = new Set();
  TASKS.forEach(t=>{ now.add(t.id); const j = jkey(t); if (SYNCED.get(t.id)===j) return; SYNCED.set(t.id, j); const body = JSON.parse(j); dbWrite('tasks/'+t.id, ()=>DBX.doc('tasks/'+t.id).set(body)); });
  [...SYNCED.keys()].forEach(id=>{ if (!now.has(id)){ SYNCED.delete(id); dbWrite('tasks/'+id, ()=>DBX.doc('tasks/'+id).delete()); } });
}
function pushProf(){ if (!DBX || !READY.has('prof')) return;
  Object.keys(PROF).forEach(id=>{ const j = jkey(PROF[id]); if (PSYNCED.get(id)===j) return; PSYNCED.set(id, j); const body = JSON.parse(j); dbWrite('prof/'+id, ()=>DBX.doc('prof/'+id).set(body)); });
}
function pushDoc(path, body){ if (!DBX || !READY.has(path)) return; const j = jkey(body); if (DSYNCED.get(path)===j) return; DSYNCED.set(path, j); const b = JSON.parse(j); dbWrite(path, ()=>DBX.doc(path).set(b)); }
/* 入力中や、下から出る画面を開いている時は、閉じてから描き直す */
function liveRender(){
  if (S.screen!=='app' && S.screen!=='login') return; /* ログイン画面も、人の一覧が届いたら描き直す */
  const a = document.activeElement;
  if (document.getElementById('scrim') || (a && a.matches && a.matches('input,textarea,select'))){ if (!liveWait){ liveWait = true; setTimeout(()=>{ liveWait = false; liveRender(); }, 900); } return; }
  render();
}
function takeTasks(docs){
  const arr = docs.map(d=>JSON.parse(jkey(d.data()))).filter(t=>t && t.id).sort((a,b)=>(b.at||0)-(a.at||0));
  SYNCED.clear(); arr.forEach(t=>SYNCED.set(t.id, jkey(t)));
  const fixed = reconcile(arr); /* 自分の直近のコメント・いいねが抜けていたら足し直す */
  const same = !fixed && arr.length===TASKS.length && arr.every(t=>{ const o = TASKS.find(x=>x.id===t.id); return o && jkey(o)===SYNCED.get(t.id); });
  if (same) return;
  TASKS = arr; try { localStorage.setItem(KEY, jkey(TASKS)); } catch(e){}
  if (fixed) pushTasks();
  liveRender();
}
function refetchTasks(){ DBX.collection('tasks').get().then(sn=>{ if (!sn.empty || !sn.metadata.fromCache) takeTasks(sn.docs); }).catch(()=>{}); }
function startSync(db){
  DBX = db; liveRender();
  let warn = setTimeout(()=>{ warn = null; toast('共有データにつながりません。この端末の保存で表示しています'); }, 10000);
  const ok = () => { if (warn){ clearTimeout(warn); warn = null; } };
  const fail = () => { ok(); toast('共有データとの接続が切れました。もう一度開きなおしてください'); };
  db.collection('tasks').onSnapshot(sn=>{ READY.add('tasks'); if (sn.empty && sn.metadata.fromCache) return; if (!sn.metadata.fromCache) ok(); takeTasks(sn.docs); }, fail);
  db.collection('stories').onSnapshot(sn=>{ if (sn.empty && sn.metadata.fromCache) return;
    const all = sn.docs.map(d=>JSON.parse(jkey(d.data()))).filter(x=>x && x.id);
    all.filter(x=>Date.now()-x.at >= ST_LIFE).forEach(x=>dbWrite('stories/'+x.id, ()=>db.doc('stories/'+x.id).delete()));
    const next = all.filter(x=>Date.now()-x.at < ST_LIFE), j = jkey(next.map(x=>x.id).sort());
    if (j===jkey(stLive().map(x=>x.id).sort())) return; STORIES = next; saveStLocal(); liveRender(); }, fail);
  db.collection('storycm').onSnapshot(sn=>{ if (sn.empty && sn.metadata.fromCache) return;
    const all = sn.docs.map(d=>JSON.parse(jkey(d.data()))).filter(x=>x && x.id);
    all.filter(x=>Date.now()-x.at >= ST_LIFE).forEach(x=>dbWrite('storycm/'+x.id, ()=>db.doc('storycm/'+x.id).delete()));
    STCM = all.filter(x=>Date.now()-x.at < ST_LIFE); try { localStorage.setItem(SCKEY, jkey(STCM)); } catch(e){} if (svRefresh) svRefresh(); }, fail);
  /* パスワード（ハッシュ）は人ごとに別の場所（pw/本人id）。だれかの登録がほかの人の登録を上書きしないように */
  db.collection('pw').onSnapshot(sn=>{ READY.add('pw'); const m = {}; sn.docs.forEach(d=>{ const b = JSON.parse(jkey(d.data())); if (b && b.h) m[d.id] = b.h; }); PWH = m;
    try { localStorage.setItem(PWKEY, jkey(PWH)); } catch(e){} PEOPLE.forEach(p=>{ p.reg = !!(PWH[p.id] || p.pwh); }); liveRender(); }, fail);
  db.collection('prof').onSnapshot(sn=>{ READY.add('prof'); let ch = false;
    sn.docs.forEach(d=>{ const v = JSON.parse(jkey(d.data())), j = jkey(v); PSYNCED.set(d.id, j); if (jkey(PROF[d.id])!==j){ PROF[d.id] = v; ch = true; } });
    if (ch){ try { localStorage.setItem(PKEY, jkey(PROF)); } catch(e){} liveRender(); } }, fail);
  const one = (path, lsKey, get, set) => db.doc(path).onSnapshot(d=>{ READY.add(path); if (!d.exists) return; const v = get(JSON.parse(jkey(d.data()))); if (v==null) return; const j = jkey(v);
    DSYNCED.set(path, jkey(d.data())); if (j===jkey(set())) return; set(v); try { localStorage.setItem(lsKey, j); } catch(e){} liveRender(); }, fail);
  one('app/units', UKEY, b=>b.m, v=>v===undefined ? UMEM : (UMEM = v));
  one('app/block', BKEY, b=>b.list, v=>v===undefined ? BLOCK : (BLOCK = v));
  one('app/foot', FKEY, b=>b.m, v=>v===undefined ? FOOT : (FOOT = v));
  db.doc('app/people').onSnapshot(d=>{ READY.add('app/people'); if (!d.exists) return; const b = JSON.parse(jkey(d.data())), list = Array.isArray(b.list) ? b.list : [], hide = Array.isArray(b.hide) ? b.hide : []; DSYNCED.set('app/people', jkey(d.data()));
    if (jkey(list)===jkey(ADDP) && jkey(hide)===jkey(HIDEP)){ if (PEND_ME){ sessResume(); render(); } return; } ADDP = list; HIDEP = hide; try { localStorage.setItem(NPKEY, jkey(ADDP)); localStorage.setItem(NHKEY, jkey(HIDEP)); } catch(e){} mergeAdded(ADDP); refreshExecs(); if (PEND_ME){ sessResume(); render(); return; } liveRender(); }, fail);
}
/* ログインをたもつ：最後に使ってから7日のあいだは、開くとそのまま入れる（ログアウトで消える） */
function sessKeep(){ try { const o = JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if (!o || o.me!==S.me || Date.now()-o.at > 36e5) localStorage.setItem(SESS_KEY, JSON.stringify({me:S.me, at:Date.now()})); } catch(e){} }
function sessClear(){ try { localStorage.removeItem(SESS_KEY); } catch(e){} }
(()=>{ try { const o = JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if (!o) return;
  if (Date.now()-o.at >= SESS_DAYS*864e5){ sessClear(); return; }
  if (canUse(E(o.me))){ S.me = o.me; S.screen = 'app'; S.view = 'home'; }
  else { PEND_ME = o.me; setTimeout(()=>{ if (PEND_ME){ PEND_ME = null; if (S.screen==='login') render(); } }, 8000); } } catch(e){} })();
/* 人の一覧が届いた時：前回のログインが残っていれば、そのまま入る */
function sessResume(){ if (!PEND_ME) return; const id = PEND_ME; PEND_ME = null; if (canUse(E(id))){ S.me = id; S.screen = 'app'; S.view = 'home'; } else sessClear(); }
/* 共有の置き場につなぐ。claude.ai のアーティファクトの中ではアーティファクトの置き場、それ以外（GitHub などに置いた時）は Supabase。どちらもなければこの端末の保存だけ */
try {
  if (window.claude && window.claude.use) window.claude.use('db').then(db=>{ if (db) startSync(db); else document.body.classList.add('guest'); }).catch(()=>{});
  else if (SUPA.url && SUPA.key){
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = () => { try { startSync(supaDb(window.supabase.createClient(SUPA.url, SUPA.key))); } catch(e){ toast('共有データにつながりません。この端末の保存で表示しています'); } };
    s.onerror = () => toast('共有データの部品を読みこめません。この端末の保存で表示しています');
    document.head.appendChild(s);
  }
} catch(e){}

render();
})();
